<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="Classic RAG searches once with the exact question; agentic RAG lets the LLM decide whether to search, rewrite the query and search several times."><title>Classic RAG searches once with the exact question; agentic RAG lets the LLM decide whether to search, rewrite the query and search several times.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="518" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Classic RAG vs. Agentic RAG</tspan></text><path d="M323.2,64 C459.28,60 640.72,68 776.8,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Who decides what to search?</tspan></text><g transform="rotate(-0.7 290.0 305.0)"><rect x="53" y="135" width="480" height="350" rx="6" fill="#000" opacity="0.08"/><rect x="50" y="130" width="480" height="350" rx="6" fill="#C9E0FB" stroke="#00000014"/><rect x="262.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="80" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="80" dy="0">Classic RAG  ·  a fixed pipeline</tspan></text><path d="M92.0,231.0 h36.0 a4,4 0 0 1 4,4 v18.0 a4,4 0 0 1 -4,4 h-24.0 l-8.0,8.0 v-8.0 h-4.0 a4,4 0 0 1 -4,-4 v-18.0 a4,4 0 0 1 4,-4 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="110" y="248.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.0" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="110" dy="0">?</tspan></text><path d="M140,245 Q165.0,245.0 190,245" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><circle cx="221.0" cy="241.0" r="11.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.4"/><path d="M229.0,249.0 l11.0,11.0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><path d="M255,245 Q280.0,245.0 305,245" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M340,231.0 Q340,245 354.0,245 Q340,245 340,259.0 Q340,245 326.0,245 Q340,245 340,231.0 z" fill="#FDE047" stroke="#1F2937" stroke-width="2"/><path d="M355.0,227.0 Q355.0,233.0 361.0,233.0 Q355.0,233.0 355.0,239.0 Q355.0,233.0 349.0,233.0 Q355.0,233.0 355.0,227.0 z" fill="#FDE047" stroke="#1F2937" stroke-width="2"/><text x="340" y="285" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="340" dy="0">answer</tspan></text><text x="225" y="285" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="225" dy="0">1 search</tspan></text><text x="80" y="362" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="80" dy="0">• Always searches exactly once</tspan><tspan x="80" dy="20.2">• Uses your exact question as the search</tspan><tspan x="80" dy="20.2">• Cheap and predictable</tspan></text><text x="80" y="455" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#4B5563" text-anchor="start" xml:space="preserve"><tspan x="80" dy="0">In our code: --retrieval-only</tspan></text><g transform="rotate(0.7 810.0 305.0)"><rect x="573" y="135" width="480" height="350" rx="6" fill="#000" opacity="0.08"/><rect x="570" y="130" width="480" height="350" rx="6" fill="#C6F0D2" stroke="#00000014"/><rect x="782.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="600" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="600" dy="0">Agentic RAG  ·  the LLM drives</tspan></text><path d="M612.0,231.0 h36.0 a4,4 0 0 1 4,4 v18.0 a4,4 0 0 1 -4,4 h-24.0 l-8.0,8.0 v-8.0 h-4.0 a4,4 0 0 1 -4,-4 v-18.0 a4,4 0 0 1 4,-4 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="630" y="248.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.0" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="630" dy="0">?</tspan></text><path d="M660,245 Q680.0,245.0 700,245" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M735,230.6 C726.0,225.2 713.4,234.2 718.8,243.2 C711.6,250.4 722.4,263.0 735,257.6 C747.6,263.0 758.4,250.4 751.2,243.2 C756.6,234.2 744.0,225.2 735,230.6 z" fill="#FBCFE8" stroke="#1F2937" stroke-width="2.2"/><path d="M735,230.6 V257.6 M726.0,241.4 q5,4 10,0 M744.0,248.6 q-5,-4 -10,0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="735" y="285" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="735" dy="0">agent</tspan></text><path d="M765,232 Q792.5,218.5 820,205" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M765,258 Q792.5,271.5 820,285" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><rect x="828" y="192" width="93" height="25" rx="12.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="874.4" y="208" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="874.4" dy="0">1st search</tspan></text><rect x="828" y="272" width="93" height="25" rx="12.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="874.4" y="288" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="874.4" dy="0">2nd search</tspan></text><path d="M932,205 Q953.5,220.5 975,236" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M932,285 Q953.5,270.5 975,256" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M998,231.0 Q998,245 1012.0,245 Q998,245 998,259.0 Q998,245 984.0,245 Q998,245 998,231.0 z" fill="#FDE047" stroke="#1F2937" stroke-width="2"/><path d="M1013.0,227.0 Q1013.0,233.0 1019.0,233.0 Q1013.0,233.0 1013.0,239.0 Q1013.0,233.0 1007.0,233.0 Q1013.0,233.0 1013.0,227.0 z" fill="#FDE047" stroke="#1F2937" stroke-width="2"/><text x="998" y="285" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="998" dy="0">answer</tspan></text><text x="880" y="325" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="880" dy="0">its own search words</tspan></text><text x="600" y="362" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="600" dy="0">• Decides IF and how often to search</tspan><tspan x="600" dy="20.2">• Rewrites the question into better searches</tspan><tspan x="600" dy="20.2">• Can also call APIs, SQL, grep</tspan></text><text x="600" y="455" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#4B5563" text-anchor="start" xml:space="preserve"><tspan x="600" dy="0">In our code: create_agent + search_codebase</tspan></text></svg>
