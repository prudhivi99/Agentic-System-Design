<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-label="The agent loop: from a goal, the agent thinks, acts by calling a tool, observes the result, and repeats until done, then gives the final answer."><title>The agent loop: from a goal, the agent thinks, acts by calling a tool, observes the result, and repeats until done, then gives the final answer.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="598" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">The agent loop: Think → Act → Observe</tspan></text><path d="M239.2,64 C425.67999999999995,60 674.3199999999999,68 860.8,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">The LLM repeats this until the goal is reached.</tspan></text><g transform="rotate(-1.5 135.0 310.0)"><rect x="53" y="255" width="170" height="120" rx="6" fill="#000" opacity="0.08"/><rect x="50" y="250" width="170" height="120" rx="6" fill="#FAD2E6" stroke="#00000014"/><rect x="107.0" y="241" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="135" y="290" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="135" dy="0">GOAL</tspan></text><text x="135" y="318" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1F2937" text-anchor="middle" font-style="italic"><tspan x="135" dy="0">"Do scheduled</tspan><tspan x="135" dy="17.6">tasks notify?"</tspan></text><g transform="rotate(0.8 570.0 200.0)"><rect x="473" y="120" width="200" height="170" rx="6" fill="#000" opacity="0.08"/><rect x="470" y="115" width="200" height="170" rx="6" fill="#FEF3A0" stroke="#00000014"/><rect x="542.0" y="106" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="496" cy="143" r="15" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="496" y="148.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.75" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="496" dy="0">1</tspan></text><path d="M563.0,183.0 C552.0,173.0 558.0,155.0 570,155.0 C582.0,155.0 588.0,173.0 577.0,183.0 z" fill="#FDE047" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><path d="M564.0,188.0 h12.0 M566.0,193.0 h8.0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="570" y="227" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="570" dy="0">THINK</tspan></text><text x="570" y="251" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="570" dy="0">What do I know?</tspan><tspan x="570" dy="16.9">What next?</tspan></text><g transform="rotate(-1 750.0 430.0)"><rect x="653" y="350" width="200" height="170" rx="6" fill="#000" opacity="0.08"/><rect x="650" y="345" width="200" height="170" rx="6" fill="#C6F0D2" stroke="#00000014"/><rect x="722.0" y="336" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="676" cy="373" r="15" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="676" y="378.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.75" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="676" dy="0">2</tspan></text><rect x="746.0" y="386.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(0 750 405)"/><rect x="746.0" y="386.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(45 750 405)"/><rect x="746.0" y="386.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(90 750 405)"/><rect x="746.0" y="386.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(135 750 405)"/><rect x="746.0" y="386.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(180 750 405)"/><rect x="746.0" y="386.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(225 750 405)"/><rect x="746.0" y="386.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(270 750 405)"/><rect x="746.0" y="386.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(315 750 405)"/><circle cx="750" cy="405" r="12.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2"/><circle cx="750" cy="405" r="4.5" fill="none" stroke="#1F2937" stroke-width="2.2"/><text x="750" y="457" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="750" dy="0">ACT</tspan></text><text x="750" y="481" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#4B5563" text-anchor="middle" xml:space="preserve"><tspan x="750" dy="0">Call a tool</tspan><tspan x="750" dy="16.9">search_codebase(…)</tspan></text><g transform="rotate(1 390.0 430.0)"><rect x="293" y="350" width="200" height="170" rx="6" fill="#000" opacity="0.08"/><rect x="290" y="345" width="200" height="170" rx="6" fill="#C9E0FB" stroke="#00000014"/><rect x="362.0" y="336" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="316" cy="373" r="15" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="316" y="378.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.75" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="316" dy="0">3</tspan></text><path d="M370.0,405 Q390,387.0 410.0,405 Q390,423.0 370.0,405 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2"/><circle cx="390" cy="405" r="6.0" fill="#1F2937"/><text x="390" y="457" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="390" dy="0">OBSERVE</tspan></text><text x="390" y="481" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#4B5563" text-anchor="middle" xml:space="preserve"><tspan x="390" dy="0">Read the result</tspan><tspan x="390" dy="16.9">scheduler.py: no notify</tspan></text><path d="M675,210 Q740.0,257.2 760,335" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M640,445 Q570.0,470.2 500,445" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M380,335 Q400.0,257.2 465,210" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M225,305 Q360.0,285.55 462,195" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><text x="560" y="330" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#EA580C" text-anchor="middle"><tspan x="560" dy="0">repeat</tspan></text><g transform="rotate(1.2 970.0 210.0)"><rect x="883" y="145" width="180" height="140" rx="6" fill="#000" opacity="0.08"/><rect x="880" y="140" width="180" height="140" rx="6" fill="#C6F0D2" stroke="#00000014"/><rect x="942.0" y="131" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="970" cy="180" r="13.0" fill="#15803D"/><path d="M964.0,180 l4.5,5.0 l8.0,-10.0" fill="none" stroke="#fff" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><text x="970" y="225" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="970" dy="0">Done?</tspan></text><text x="970" y="250" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="970" dy="0">→ final answer</tspan></text><path d="M675,160 Q775.9,159.24 872,190" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#head)"/><text x="780" y="150" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="780" dy="0">when done</tspan></text><text x="550.0" y="572" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">The LLM only ASKS for a tool call. Your code runs the tool and gives the result back.</tspan></text></svg>
