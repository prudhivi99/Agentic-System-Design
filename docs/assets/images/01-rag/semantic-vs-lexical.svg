<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-label="Semantic search matches meaning and handles synonyms but misses exact names; lexical BM25 matches exact words like AuthService but misses synonyms. Using both is hybrid RAG."><title>Semantic search matches meaning and handles synonyms but misses exact names; lexical BM25 matches exact words like AuthService but misses synonyms. Using both is hybrid RAG.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="598" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Semantic vs. lexical search</tspan></text><path d="M323.2,64 C459.28,60 640.72,68 776.8,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Real results from modules 02 and 03: each one wins different questions.</tspan></text><g transform="rotate(-0.6 290.0 320.0)"><rect x="53" y="135" width="480" height="380" rx="6" fill="#000" opacity="0.08"/><rect x="50" y="130" width="480" height="380" rx="6" fill="#C9E0FB" stroke="#00000014"/><rect x="262.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="80" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="80" dy="0">Semantic (embeddings)</tspan></text><text x="80" y="198" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4B5563" text-anchor="start"><tspan x="80" dy="0">matches MEANING</tspan></text><text x="80" y="236" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="80" dy="0">✓  different words, same idea</tspan><tspan x="80" dy="19.5">✓  synonyms, everyday language</tspan><tspan x="80" dy="19.5">✗  exact names, IDs, error codes</tspan></text><g transform="rotate(0.5 290.0 412.5)"><rect x="78" y="345" width="430" height="145" rx="6" fill="#000" opacity="0.08"/><rect x="75" y="340" width="430" height="145" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="95" y="370" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#4B5563" text-anchor="start"><tspan x="95" dy="0">Example</tspan></text><text x="95" y="398" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="95" dy="0">"generate bill" ≈ "create invoice"</tspan><tspan x="95" dy="17.6">(same meaning, no shared word)</tspan><tspan x="95" dy="17.6"> </tspan><tspan x="95" dy="17.6">"AuthService" with k=1 (module 02)</tspan><tspan x="95" dy="17.6">→ returned AuthError ✗</tspan></text><g transform="rotate(0.6 810.0 320.0)"><rect x="573" y="135" width="480" height="380" rx="6" fill="#000" opacity="0.08"/><rect x="570" y="130" width="480" height="380" rx="6" fill="#FEF3A0" stroke="#00000014"/><rect x="782.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="600" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="600" dy="0">Lexical (BM25)</tspan></text><text x="600" y="198" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4B5563" text-anchor="start"><tspan x="600" dy="0">matches exact WORDS</tspan></text><text x="600" y="236" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="600" dy="0">✓  class names, functions, APIs</tspan><tspan x="600" dy="19.5">✓  error messages, IDs</tspan><tspan x="600" dy="19.5">✗  synonyms, other wordings</tspan></text><g transform="rotate(-0.5 810.0 412.5)"><rect x="598" y="345" width="430" height="145" rx="6" fill="#000" opacity="0.08"/><rect x="595" y="340" width="430" height="145" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="615" y="370" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#4B5563" text-anchor="start"><tspan x="615" dy="0">Example</tspan></text><text x="615" y="398" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="615" dy="0">"AuthService"  →  class AuthService #1 ✓</tspan><tspan x="615" dy="17.6">(module 03, sample_project)</tspan><tspan x="615" dy="17.6"> </tspan><tspan x="615" dy="17.6">"generate bill"  →  send_invoice</tspan><tspan x="615" dy="17.6">scores 0 (BM25 demo) ✗</tspan></text><g transform="rotate(-0.3 550.0 555.0)"><rect x="253" y="535" width="600" height="50" rx="6" fill="#000" opacity="0.08"/><rect x="250" y="530" width="600" height="50" rx="6" fill="#C6F0D2" stroke="#00000014"/></g><text x="550" y="562" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">Neither always wins  →  use both: Hybrid RAG</tspan></text></svg>
