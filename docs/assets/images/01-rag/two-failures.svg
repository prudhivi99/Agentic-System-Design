<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-label="A RAG pipeline goes question, retriever, chunks, LLM. Failure 1: the retriever misses the right chunk. Failure 2: the chunk is found but the LLM ignores it or invents."><title>A RAG pipeline goes question, retriever, chunks, LLM. Failure 1: the retriever misses the right chunk. Failure 2: the chunk is found but the LLM ignores it or invents.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="468" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">A RAG system can fail in 2 places</tspan></text><path d="M272.79999999999995,64 C439.12,60 660.88,68 827.2,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">So every test checks both: was the right chunk found? Is the answer right?</tspan></text><g transform="rotate(-1 160.0 190.0)"><rect x="73" y="135" width="180" height="120" rx="6" fill="#000" opacity="0.08"/><rect x="70" y="130" width="180" height="120" rx="6" fill="#FAD2E6" stroke="#00000014"/></g><path d="M142.0,161.0 h36.0 a4,4 0 0 1 4,4 v18.0 a4,4 0 0 1 -4,4 h-24.0 l-8.0,8.0 v-8.0 h-4.0 a4,4 0 0 1 -4,-4 v-18.0 a4,4 0 0 1 4,-4 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="160" y="178.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.0" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="160" dy="0">?</tspan></text><text x="160" y="230" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="160" dy="0">Question</tspan></text><path d="M256,190 Q290.0,190.0 324,190" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(0.8 420.0 190.0)"><rect x="333" y="135" width="180" height="120" rx="6" fill="#000" opacity="0.08"/><rect x="330" y="130" width="180" height="120" rx="6" fill="#FEF3A0" stroke="#00000014"/></g><circle cx="416.0" cy="171.0" r="11.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.4"/><path d="M424.0,179.0 l11.0,11.0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><text x="420" y="230" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="420" dy="0">Retriever</tspan></text><path d="M516,190 Q550.0,190.0 584,190" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(-0.6 680.0 190.0)"><rect x="593" y="135" width="180" height="120" rx="6" fill="#000" opacity="0.08"/><rect x="590" y="130" width="180" height="120" rx="6" fill="#C6F0D2" stroke="#00000014"/></g><path d="M660.0,153.8 h15.600000000000001 l8.399999999999999,8.399999999999999 v22.000000000000004 h-24.0 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><path d="M664.8,166.60000000000002 h14.399999999999999 M664.8,172.20000000000002 h14.399999999999999 M664.8,177.8 h9.6" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M668.0,159.8 h15.600000000000001 l8.399999999999999,8.399999999999999 v22.000000000000004 h-24.0 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><path d="M672.8,172.60000000000002 h14.399999999999999 M672.8,178.20000000000002 h14.399999999999999 M672.8,183.8 h9.6" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M676.0,165.8 h15.600000000000001 l8.399999999999999,8.399999999999999 v22.000000000000004 h-24.0 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><path d="M680.8,178.60000000000002 h14.399999999999999 M680.8,184.20000000000002 h14.399999999999999 M680.8,189.8 h9.6" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="680" y="230" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="680" dy="0">Chunks</tspan></text><path d="M776,190 Q810.0,190.0 844,190" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(0.9 940.0 190.0)"><rect x="853" y="135" width="180" height="120" rx="6" fill="#000" opacity="0.08"/><rect x="850" y="130" width="180" height="120" rx="6" fill="#C9E0FB" stroke="#00000014"/></g><path d="M940,161.0 Q940,175 954.0,175 Q940,175 940,189.0 Q940,175 926.0,175 Q940,175 940,161.0 z" fill="#FDE047" stroke="#1F2937" stroke-width="2"/><path d="M955.0,157.0 Q955.0,163.0 961.0,163.0 Q955.0,163.0 955.0,169.0 Q955.0,163.0 949.0,163.0 Q955.0,163.0 955.0,157.0 z" fill="#FDE047" stroke="#1F2937" stroke-width="2"/><text x="940" y="230" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="940" dy="0">LLM → Answer</tspan></text><path d="M400,262 v30" stroke="#DC2626" stroke-width="3" stroke-dasharray="5 4"/><g transform="rotate(0.5 400.0 370.0)"><rect x="223" y="305" width="360" height="140" rx="6" fill="#000" opacity="0.08"/><rect x="220" y="300" width="360" height="140" rx="6" fill="#FFFFFF" stroke="#00000014"/><rect x="372.0" y="291" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="250" cy="330" r="11.700000000000001" fill="#DC2626"/><path d="M245.5,325.5 l9.0,9.0 M254.5,325.5 l-9.0,9.0" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/><text x="272" y="336" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="272" dy="0">Failure 1: Right chunk NOT found</tspan></text><text x="242" y="372" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="242" dy="0">Checked by: file hit, chunk hit</tspan></text><text x="242" y="410" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="start"><tspan x="242" dy="0">Fix: chunk size, k, embedding model</tspan></text><path d="M880,262 v30" stroke="#DC2626" stroke-width="3" stroke-dasharray="5 4"/><g transform="rotate(-0.5 880.0 370.0)"><rect x="703" y="305" width="360" height="140" rx="6" fill="#000" opacity="0.08"/><rect x="700" y="300" width="360" height="140" rx="6" fill="#FFFFFF" stroke="#00000014"/><rect x="852.0" y="291" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="730" cy="330" r="11.700000000000001" fill="#DC2626"/><path d="M725.5,325.5 l9.0,9.0 M734.5,325.5 l-9.0,9.0" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/><text x="752" y="336" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="752" dy="0">Failure 2: Chunk found, answer wrong</tspan></text><text x="722" y="372" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="722" dy="0">Ignored it, misread it, or invented</tspan></text><text x="722" y="410" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="start"><tspan x="722" dy="0">Fix: prompt, "say not found" rule</tspan></text></svg>
