<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="BM25 uses term frequency with diminishing returns, word rarity (IDF), and a document length penalty; the score is the sum over query words of rarity times length-adjusted frequency."><title>BM25 uses term frequency with diminishing returns, word rarity (IDF), and a document length penalty; the score is the sum over query words of rarity times length-adjusted frequency.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="558" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">BM25 scores a match with 3 ideas</tspan></text><path d="M281.2,64 C442.48,60 657.52,68 818.8,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">For each query word found in a document, then added up over all query words.</tspan></text><g transform="rotate(-0.8 210.0 280.0)"><rect x="58" y="140" width="310" height="290" rx="6" fill="#000" opacity="0.08"/><rect x="55" y="135" width="310" height="290" rx="6" fill="#FEF3A0" stroke="#00000014"/><rect x="182.0" y="126" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="83" cy="165" r="15" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="83" y="170.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.75" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="83" dy="0">1</tspan></text><text x="210" y="215" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="210" dy="0">Term frequency</tspan></text><text x="210" y="250" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1F2937" text-anchor="middle"><tspan x="210" dy="0">the word appears MORE often</tspan><tspan x="210" dy="18.9">→ higher score</tspan></text><path d="M85,300 h250" stroke="#00000022"/><text x="210" y="335" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="210" dy="0">…but with diminishing returns:</tspan><tspan x="210" dy="17.6">the 10th mention adds little</tspan></text><g transform="rotate(0.6 550.0 280.0)"><rect x="398" y="140" width="310" height="290" rx="6" fill="#000" opacity="0.08"/><rect x="395" y="135" width="310" height="290" rx="6" fill="#C6F0D2" stroke="#00000014"/><rect x="522.0" y="126" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="423" cy="165" r="15" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="423" y="170.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.75" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="423" dy="0">2</tspan></text><text x="550" y="215" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">Word rarity (IDF)</tspan></text><text x="550" y="250" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">the word is RARE across docs</tspan><tspan x="550" dy="18.9">→ counts more</tspan></text><path d="M425,300 h250" stroke="#00000022"/><text x="550" y="335" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle" xml:space="preserve"><tspan x="550" dy="0">"invoice" in 2 of 5 docs: 0.88</tspan><tspan x="550" dy="17.6">"customer" in 3 of 5 docs: 0.54</tspan></text><g transform="rotate(-0.5 890.0 280.0)"><rect x="738" y="140" width="310" height="290" rx="6" fill="#000" opacity="0.08"/><rect x="735" y="135" width="310" height="290" rx="6" fill="#C9E0FB" stroke="#00000014"/><rect x="862.0" y="126" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="763" cy="165" r="15" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="763" y="170.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.75" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="763" dy="0">3</tspan></text><text x="890" y="215" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="890" dy="0">Length penalty</tspan></text><text x="890" y="250" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1F2937" text-anchor="middle"><tspan x="890" dy="0">the document is LONGER than</tspan><tspan x="890" dy="18.9">average → score goes down</tspan></text><path d="M765,300 h250" stroke="#00000022"/><text x="890" y="335" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="890" dy="0">long docs contain more words</tspan><tspan x="890" dy="17.6">by size, not by relevance</tspan></text><path d="M95,415 Q150,372 210,370 T330,366" fill="none" stroke="#EA580C" stroke-width="3"/><g transform="rotate(0.3 550.0 492.5)"><rect x="143" y="460" width="820" height="75" rx="6" fill="#000" opacity="0.08"/><rect x="140" y="455" width="820" height="75" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="550" y="487" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="550" dy="0">score(doc)  =  Σ over query words:  rarity  ×  frequency (adjusted for length)</tspan></text><text x="550" y="514" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550" dy="0">A word that is not in the document adds 0. No word in common → score 0.</tspan></text></svg>
