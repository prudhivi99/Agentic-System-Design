<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" role="img" aria-label="Faithfulness checks each claim of the answer against the chunks: one of two claims is invented, so 0.5. Answer relevancy checks whether the answer addresses the question: a true answer that never states the limit scores low."><title>Faithfulness checks each claim of the answer against the chunks: one of two claims is invented, so 0.5. Answer relevancy checks whether the answer addresses the question: a true answer that never states the limit scores low.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="578" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Faithfulness vs. answer relevancy</tspan></text><path d="M272.79999999999995,64 C439.12,60 660.88,68 827.2,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Two ways a good-looking answer can still be wrong.</tspan></text><g transform="rotate(-0.6 290.0 335.0)"><rect x="53" y="135" width="480" height="410" rx="6" fill="#000" opacity="0.08"/><rect x="50" y="130" width="480" height="410" rx="6" fill="#FEF3A0" stroke="#00000014"/><rect x="262.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="80" y="170" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="80" dy="0">Faithfulness</tspan></text><text x="80" y="195" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4B5563" text-anchor="start"><tspan x="80" dy="0">Did the LLM stick to the chunks?</tspan></text><text x="80" y="228" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="80" dy="0">Q: What happens when a free user</tspan></text><text x="80" y="246" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="80" dy="0">   hits the task limit?</tspan></text><text x="80" y="278" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="start" xml:space="preserve"><tspan x="80" dy="0">Chunk: check_task_limit raises</tspan></text><text x="80" y="296" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="start" xml:space="preserve"><tspan x="80" dy="0">       BillingError("Upgrade your plan")</tspan></text><text x="80" y="330" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="80" dy="0">Answer split into claims:</tspan></text><circle cx="95" cy="360" r="9.75" fill="#15803D"/><path d="M90.5,360 l3.375,3.75 l6.0,-7.5" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="365" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="115" dy="0">"A BillingError is raised"</tspan></text><circle cx="95" cy="395" r="9.75" fill="#DC2626"/><path d="M91.25,391.25 l7.5,7.5 M98.75,391.25 l-7.5,7.5" stroke="#fff" stroke-width="2.25" stroke-linecap="round"/><text x="115" y="400" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="115" dy="0">"…and an email warning is sent"</tspan></text><text x="115" y="420" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#DC2626" text-anchor="start" font-style="italic"><tspan x="115" dy="0">not in the chunk: invented</tspan></text><text x="80" y="470" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="800" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="80" dy="0">Faithfulness = 1 / 2 = 0.5</tspan></text><text x="80" y="500" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#DC2626" text-anchor="start"><tspan x="80" dy="0">catches: hallucination</tspan></text><g transform="rotate(0.6 810.0 335.0)"><rect x="573" y="135" width="480" height="410" rx="6" fill="#000" opacity="0.08"/><rect x="570" y="130" width="480" height="410" rx="6" fill="#C9E0FB" stroke="#00000014"/><rect x="782.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="600" y="170" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="600" dy="0">Answer relevancy</tspan></text><text x="600" y="195" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4B5563" text-anchor="start"><tspan x="600" dy="0">Did it answer THE question asked?</tspan></text><text x="600" y="228" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="600" dy="0">Q: What is the task limit</tspan></text><text x="600" y="246" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="600" dy="0">   for a free user?</tspan></text><text x="600" y="290" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="600" dy="0">Answer:</tspan></text><text x="600" y="315" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" font-style="italic"><tspan x="600" dy="0">"Plans are stored per user, and</tspan><tspan x="600" dy="18.2">users can upgrade their plan tier."</tspan></text><circle cx="615" cy="380" r="9.75" fill="#15803D"/><path d="M610.5,380 l3.375,3.75 l6.0,-7.5" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/><text x="635" y="385" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="635" dy="0">true, and supported by the code</tspan></text><circle cx="615" cy="415" r="9.75" fill="#DC2626"/><path d="M611.25,411.25 l7.5,7.5 M618.75,411.25 l-7.5,7.5" stroke="#fff" stroke-width="2.25" stroke-linecap="round"/><text x="635" y="420" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="635" dy="0">but never says "10"</tspan></text><text x="600" y="470" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="800" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="600" dy="0">Answer relevancy: LOW</tspan></text><text x="600" y="500" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#DC2626" text-anchor="start"><tspan x="600" dy="0">catches: answering the wrong thing</tspan></text></svg>
