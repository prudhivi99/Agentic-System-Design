<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-label="A map of advanced RAG: ingest, query, retrieve, check chunks, generate, check answer, with the patterns that plug into each step, such as RAPTOR, HyDE, hybrid, reranking, Corrective RAG and Self-RAG."><title>A map of advanced RAG: ingest, query, retrieve, check chunks, generate, check answer, with the patterns that plug into each step, such as RAPTOR, HyDE, hybrid, reranking, Corrective RAG and Self-RAG.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="598" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Add one extra step → a new kind of RAG</tspan></text><path d="M230.79999999999995,64 C422.31999999999994,60 677.6800000000001,68 869.2,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Basic RAG is ingest → retrieve → generate. Each advanced pattern plugs into one step.</tspan></text><g transform="rotate(0 110.0 176.0)"><rect x="33" y="135" width="160" height="92" rx="6" fill="#000" opacity="0.08"/><rect x="30" y="130" width="160" height="92" rx="6" fill="#FEF3A0" stroke="#00000014"/></g><circle cx="52" cy="152" r="13" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="52" y="156.94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.65" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="52" dy="0">1</tspan></text><text x="110" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="110" dy="0">Ingest</tspan></text><text x="110" y="204" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="110" dy="0">chunk · embed · store</tspan></text><path d="M192,176 Q199.0,176.0 206,176" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(0 288.0 176.0)"><rect x="211" y="135" width="160" height="92" rx="6" fill="#000" opacity="0.08"/><rect x="208" y="130" width="160" height="92" rx="6" fill="#FAD2E6" stroke="#00000014"/></g><circle cx="230" cy="152" r="13" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="230" y="156.94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.65" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="230" dy="0">2</tspan></text><text x="288" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="288" dy="0">Query</tspan></text><text x="288" y="204" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="288" dy="0">the user's question</tspan></text><path d="M370,176 Q377.0,176.0 384,176" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(0 466.0 176.0)"><rect x="389" y="135" width="160" height="92" rx="6" fill="#000" opacity="0.08"/><rect x="386" y="130" width="160" height="92" rx="6" fill="#C9E0FB" stroke="#00000014"/></g><circle cx="408" cy="152" r="13" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="408" y="156.94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.65" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="408" dy="0">3</tspan></text><text x="466" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="466" dy="0">Retrieve</tspan></text><text x="466" y="204" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="466" dy="0">find chunks</tspan></text><path d="M548,176 Q555.0,176.0 562,176" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(0 644.0 176.0)"><rect x="567" y="135" width="160" height="92" rx="6" fill="#000" opacity="0.08"/><rect x="564" y="130" width="160" height="92" rx="6" fill="#C6F0D2" stroke="#00000014"/></g><circle cx="586" cy="152" r="13" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="586" y="156.94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.65" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="586" dy="0">4</tspan></text><text x="644" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="644" dy="0">Check chunks</tspan></text><text x="644" y="204" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="644" dy="0">keep the good ones</tspan></text><path d="M726,176 Q733.0,176.0 740,176" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(0 822.0 176.0)"><rect x="745" y="135" width="160" height="92" rx="6" fill="#000" opacity="0.08"/><rect x="742" y="130" width="160" height="92" rx="6" fill="#E0D9FB" stroke="#00000014"/></g><circle cx="764" cy="152" r="13" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="764" y="156.94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.65" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="764" dy="0">5</tspan></text><text x="822" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="822" dy="0">Generate</tspan></text><text x="822" y="204" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="822" dy="0">LLM answers</tspan></text><path d="M904,176 Q911.0,176.0 918,176" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(0 1000.0 176.0)"><rect x="923" y="135" width="160" height="92" rx="6" fill="#000" opacity="0.08"/><rect x="920" y="130" width="160" height="92" rx="6" fill="#FED9B4" stroke="#00000014"/></g><circle cx="942" cy="152" r="13" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="942" y="156.94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.65" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="942" dy="0">6</tspan></text><text x="1000" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="1000" dy="0">Check answer</tspan></text><text x="1000" y="204" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="1000" dy="0">is it supported?</tspan></text><text x="550.0" y="252" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="550.0" dy="0">steps 1, 3 and 5 = basic RAG     ·     steps 2, 4 and 6 = optional extra steps</tspan></text><path d="M110,228 v0" /><path d="M110,270 Q110.0,282.0 110,294" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/><rect x="35" y="300" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="110" y="325" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="110" dy="0">Agentic chunking</tspan></text><rect x="35" y="352" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="110" y="377" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="110" dy="0">Table-aware chunks</tspan></text><rect x="35" y="404" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="110" y="429" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="110" dy="0">RAPTOR (summary tree)</tspan></text><path d="M288,228 v0" /><path d="M288,270 Q288.0,282.0 288,294" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/><rect x="213" y="300" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="288" y="325" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="288" dy="0">Query rewriting</tspan></text><rect x="213" y="352" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="288" y="377" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="288" dy="0">Multi-query</tspan></text><rect x="213" y="404" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="288" y="429" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="288" dy="0">HyDE</tspan></text><path d="M466,228 v0" /><path d="M466,270 Q466.0,282.0 466,294" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/><rect x="391" y="300" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="466" y="325" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="466" dy="0">Hybrid (BM25 + vector)</tspan></text><rect x="391" y="352" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="466" y="377" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="466" dy="0">Agentic routing</tspan></text><rect x="391" y="404" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="466" y="429" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="466" dy="0">Other sources: web, SQL</tspan></text><path d="M644,228 v0" /><path d="M644,270 Q644.0,282.0 644,294" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/><rect x="569" y="300" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="644" y="325" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="644" dy="0">Reranking</tspan></text><rect x="569" y="352" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="644" y="377" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="644" dy="0">Corrective RAG</tspan></text><rect x="569" y="404" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000010"/><text x="644" y="429" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="644" dy="0">(grade the chunks)</tspan></text><path d="M822,228 v0" /><path d="M822,270 Q822.0,282.0 822,294" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/><rect x="747" y="300" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="822" y="325" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="822" dy="0">Repeat the question</tspan></text><rect x="747" y="352" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000010"/><text x="822" y="377" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="822" dy="0">in the prompt</tspan></text><rect x="747" y="404" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000010"/><text x="822" y="429" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="822" dy="0">(research idea)</tspan></text><path d="M1000,228 v0" /><path d="M1000,270 Q1000.0,282.0 1000,294" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/><rect x="925" y="300" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="1000" y="325" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="1000" dy="0">Self-RAG</tspan></text><rect x="925" y="352" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="1000" y="377" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="1000" dy="0">Fact-check / judge</tspan></text><rect x="925" y="404" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#00000025"/><text x="1000" y="429" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="1000" dy="0">Citations</tspan></text><g transform="rotate(-0.3 550.0 525.0)"><rect x="153" y="485" width="800" height="90" rx="6" fill="#000" opacity="0.08"/><rect x="150" y="480" width="800" height="90" rx="6" fill="#FEF3A0" stroke="#00000014"/></g><text x="550" y="515" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">Every extra step = better answers, but more LLM calls, cost and latency.</tspan></text><text x="550" y="545" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550" dy="0">Add a step only when your test cases show the problem it fixes.</tspan></text></svg>
