<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-label="Without metrics a change only looks or feels better; with metrics you can see Recall@5, faithfulness and correctness go up."><title>Without metrics a change only looks or feels better; with metrics you can see Recall@5, faithfulness and correctness go up.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="468" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Why metrics? Opinions vs. numbers</tspan></text><path d="M272.79999999999995,64 C439.12,60 660.88,68 827.2,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">You changed the chunk size. Did the system get better?</tspan></text><g transform="rotate(-0.8 285.0 270.0)"><rect x="63" y="135" width="450" height="280" rx="6" fill="#000" opacity="0.08"/><rect x="60" y="130" width="450" height="280" rx="6" fill="#FAD2E6" stroke="#00000014"/><rect x="257.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="100" cy="168" r="13.0" fill="#DC2626"/><path d="M95.0,163.0 l10.0,10.0 M105.0,163.0 l-10.0,10.0" stroke="#fff" stroke-width="3.0" stroke-linecap="round"/><text x="125" y="175" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="125" dy="0">Without metrics</tspan></text><text x="100" y="230" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic"><tspan x="100" dy="0">"looks better…"</tspan></text><text x="100" y="272" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic"><tspan x="100" dy="0">"feels better…"</tspan></text><text x="100" y="314" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic"><tspan x="100" dy="0">"maybe better?"</tspan></text><text x="100" y="385" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#DC2626" text-anchor="start"><tspan x="100" dy="0">You can't tell, and you can't argue.</tspan></text><g transform="rotate(0.8 815.0 270.0)"><rect x="593" y="135" width="450" height="280" rx="6" fill="#000" opacity="0.08"/><rect x="590" y="130" width="450" height="280" rx="6" fill="#C6F0D2" stroke="#00000014"/><rect x="787.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="630" cy="168" r="13.0" fill="#15803D"/><path d="M624.0,168 l4.5,5.0 l8.0,-10.0" fill="none" stroke="#fff" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><text x="655" y="175" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="655" dy="0">With metrics</tspan></text><rect x="625" y="220" width="380" height="36" rx="8" fill="#FFFFFF" stroke="#00000020"/><text x="642" y="244" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="642" dy="0">Recall@5</tspan></text><text x="990" y="244" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#15803D" text-anchor="end" xml:space="preserve"><tspan x="990" dy="0">0.62 → 0.80  ↑</tspan></text><rect x="625" y="266" width="380" height="36" rx="8" fill="#FFFFFF" stroke="#00000020"/><text x="642" y="290" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="642" dy="0">Faithfulness</tspan></text><text x="990" y="290" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#15803D" text-anchor="end" xml:space="preserve"><tspan x="990" dy="0">0.85 → 0.91  ↑</tspan></text><rect x="625" y="312" width="380" height="36" rx="8" fill="#FFFFFF" stroke="#00000020"/><text x="642" y="336" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="642" dy="0">Correctness</tspan></text><text x="990" y="336" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#15803D" text-anchor="end" xml:space="preserve"><tspan x="990" dy="0">0.70 → 0.78  ↑</tspan></text><text x="630" y="385" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#15803D" text-anchor="start"><tspan x="630" dy="0">Measurable, comparable, repeatable.</tspan></text><text x="550.0" y="448" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Metrics turn opinions into numbers.  (example numbers)</tspan></text></svg>
