<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="Four layers and their metrics: chunking with recall and precision at K; retrieval with recall, hit rate, MRR and context recall; reranking with precision at K and NDCG; generation with faithfulness and answer relevancy; plus factual correctness end to end."><title>Four layers and their metrics: chunking with recall and precision at K; retrieval with recall, hit rate, MRR and context recall; reranking with precision at K and NDCG; generation with faithfulness and answer relevancy; plus factual correctness end to end.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="518" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Which metric points to which layer?</tspan></text><path d="M256.0,64 C432.4,60 667.5999999999999,68 844.0,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">A low score tells you where to look.</tspan></text><g transform="rotate(0 550.0 163.0)"><rect x="83" y="135" width="940" height="66" rx="6" fill="#000" opacity="0.08"/><rect x="80" y="130" width="940" height="66" rx="6" fill="#FEF3A0" stroke="#00000014"/></g><text x="110" y="160" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="110" dy="0">1  Chunking</tspan></text><text x="110" y="183" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="110" dy="0">how documents are split</tspan></text><text x="990" y="172" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1F2937" text-anchor="end" xml:space="preserve"><tspan x="990" dy="0">→  Recall@K, Precision@K</tspan></text><g transform="rotate(0 550.0 245.0)"><rect x="83" y="217" width="940" height="66" rx="6" fill="#000" opacity="0.08"/><rect x="80" y="212" width="940" height="66" rx="6" fill="#C6F0D2" stroke="#00000014"/></g><text x="110" y="242" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="110" dy="0">2  Retrieval</tspan></text><text x="110" y="265" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="110" dy="0">what gets fetched</tspan></text><text x="990" y="254" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1F2937" text-anchor="end" xml:space="preserve"><tspan x="990" dy="0">→  Recall@K, Hit rate, MRR, context recall</tspan></text><g transform="rotate(0 550.0 327.0)"><rect x="83" y="299" width="940" height="66" rx="6" fill="#000" opacity="0.08"/><rect x="80" y="294" width="940" height="66" rx="6" fill="#C9E0FB" stroke="#00000014"/></g><text x="110" y="324" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="110" dy="0">3  Reranking</tspan></text><text x="110" y="347" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="110" dy="0">the order of the top k</tspan></text><text x="990" y="336" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1F2937" text-anchor="end" xml:space="preserve"><tspan x="990" dy="0">→  Precision@K, NDCG</tspan></text><g transform="rotate(0 550.0 409.0)"><rect x="83" y="381" width="940" height="66" rx="6" fill="#000" opacity="0.08"/><rect x="80" y="376" width="940" height="66" rx="6" fill="#E0D9FB" stroke="#00000014"/></g><text x="110" y="406" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="110" dy="0">4  Generation</tspan></text><text x="110" y="429" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="110" dy="0">the LLM's answer</tspan></text><text x="990" y="418" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1F2937" text-anchor="end" xml:space="preserve"><tspan x="990" dy="0">→  Faithfulness, answer relevancy</tspan></text><g transform="rotate(0 550.0 483.0)"><rect x="83" y="465" width="940" height="46" rx="6" fill="#000" opacity="0.08"/><rect x="80" y="460" width="940" height="46" rx="6" fill="#FED9B4" stroke="#00000014"/></g><text x="550" y="490" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">End-to-end, across all layers:  factual correctness</tspan></text></svg>
