<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-label="ast.parse turns four lines of billing.py into a tree: Module, ClassDef BillingService, FunctionDef check_task_limit, If, Raise."><title>ast.parse turns four lines of billing.py into a tree: Module, ClassDef BillingService, FunctionDef check_task_limit, If, Raise.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="598" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">AST: code becomes a tree</tspan></text><path d="M348.4,64 C469.36,60 630.64,68 751.6,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Python's ast module reads the structure, not just the characters.</tspan></text><g transform="rotate(-0.8 265.0 290.0)"><rect x="53" y="145" width="430" height="300" rx="6" fill="#000" opacity="0.08"/><rect x="50" y="140" width="430" height="300" rx="6" fill="#FFFFFF" stroke="#00000014"/><rect x="237.0" y="131" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="80" y="178" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#4B5563" text-anchor="start"><tspan x="80" dy="0">billing.py (simplified)</tspan></text><rect x="72" y="205" width="388" height="36" rx="6" fill="#E0D9FB"/><text x="84" y="229" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="84" dy="0">class BillingService:</tspan></text><rect x="72" y="257" width="388" height="36" rx="6" fill="#C9E0FB"/><text x="84" y="281" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="84" dy="0">    def check_task_limit(self, user):</tspan></text><rect x="72" y="309" width="388" height="36" rx="6" fill="#C6F0D2"/><text x="84" y="333" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="84" dy="0">        if current_count &gt;= limit:</tspan></text><rect x="72" y="361" width="388" height="36" rx="6" fill="#FED9B4"/><text x="84" y="385" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="84" dy="0">            raise BillingError("…")</tspan></text><text x="265" y="425" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="265" dy="0">4 lines of text</tspan></text><path d="M495,290 Q535.0,290.0 575,290" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><text x="535" y="275" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="535" dy="0">ast.parse()</tspan></text><g transform="rotate(0 810.0 181.0)"><rect x="718" y="155" width="190" height="62" rx="6" fill="#000" opacity="0.08"/><rect x="715" y="150" width="190" height="62" rx="6" fill="#F3F4F6" stroke="#00000014"/></g><text x="810" y="176" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="810" dy="0">Module</tspan></text><text x="810" y="198" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle" xml:space="preserve"><tspan x="810" dy="0">the whole file</tspan></text><g transform="rotate(0 810.0 276.0)"><rect x="718" y="250" width="190" height="62" rx="6" fill="#000" opacity="0.08"/><rect x="715" y="245" width="190" height="62" rx="6" fill="#E0D9FB" stroke="#00000014"/></g><text x="810" y="271" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="810" dy="0">ClassDef</tspan></text><text x="810" y="293" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle" xml:space="preserve"><tspan x="810" dy="0">BillingService</tspan></text><g transform="rotate(0 810.0 371.0)"><rect x="718" y="345" width="190" height="62" rx="6" fill="#000" opacity="0.08"/><rect x="715" y="340" width="190" height="62" rx="6" fill="#C9E0FB" stroke="#00000014"/></g><text x="810" y="366" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="810" dy="0">FunctionDef</tspan></text><text x="810" y="388" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle" xml:space="preserve"><tspan x="810" dy="0">check_task_limit</tspan></text><g transform="rotate(0 700.0 471.0)"><rect x="608" y="445" width="190" height="62" rx="6" fill="#000" opacity="0.08"/><rect x="605" y="440" width="190" height="62" rx="6" fill="#C6F0D2" stroke="#00000014"/></g><text x="700" y="466" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="700" dy="0">If</tspan></text><text x="700" y="488" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle" xml:space="preserve"><tspan x="700" dy="0">current_count &gt;= limit</tspan></text><g transform="rotate(0 920.0 471.0)"><rect x="828" y="445" width="190" height="62" rx="6" fill="#000" opacity="0.08"/><rect x="825" y="440" width="190" height="62" rx="6" fill="#F3F4F6" stroke="#00000014"/></g><text x="920" y="466" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="920" dy="0">arguments</tspan></text><text x="920" y="488" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle" xml:space="preserve"><tspan x="920" dy="0">self, user</tspan></text><g transform="rotate(0 700.0 556.0)"><rect x="608" y="535" width="190" height="52" rx="6" fill="#000" opacity="0.08"/><rect x="605" y="530" width="190" height="52" rx="6" fill="#FED9B4" stroke="#00000014"/></g><text x="700" y="554" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="700" dy="0">Raise</tspan></text><text x="700" y="573" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle" xml:space="preserve"><tspan x="700" dy="0">BillingError</tspan></text><path d="M810,212 L810,243" stroke="#1F2937" stroke-width="2.2"/><path d="M810,307 L810,338" stroke="#1F2937" stroke-width="2.2"/><path d="M790,402 L720,438" stroke="#1F2937" stroke-width="2.2"/><path d="M830,402 L900,438" stroke="#1F2937" stroke-width="2.2"/><path d="M700,502 L700,528" stroke="#1F2937" stroke-width="2.2"/><text x="1050" y="278" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="end" font-style="italic"><tspan x="1050" dy="0">each box</tspan><tspan x="1050" dy="17.6">= a node</tspan></text><text x="265" y="480" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="265" dy="0">Same colour = same piece of code.</tspan><tspan x="265" dy="18.9">The tree knows where each</tspan><tspan x="265" dy="18.9">class and function starts and ends.</tspan></text></svg>
