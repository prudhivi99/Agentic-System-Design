l?</tspan></text><text x="700" y="240" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="700" dy="0">useful returned / all returned</tspan></text><text x="700" y="268" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="700" dy="0">= 3 / 4 = 0.75</tspan></text><g transform="rotate(-0.6 865.0 377.5)"><rect x="683" y="310" width="370" height="145" rx="6" fill="#000" opacity="0.08"/><rect x="680" y="305" width="370" height="145" rx="6" fill="#C9E0FB" stroke="#00000014"/><rect x="837.0" y="296" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="700" y="340" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="700" dy="0">Recall</tspan></text><text x="700" y="365" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="700" dy="0">of all useful chunks, how many did I find?</tspan></text><text x="700" y="405" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="700" dy="0">useful returned / all useful</tspan></text><text x="700" y="433" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="700" dy="0">= 3 / 5 = 0.60</tspan></text><g transform="rotate(-0.3 550.0 507.0)"><rect x="153" y="483" width="800" height="58" rx="6" fill="#000" opacity="0.08"/><rect x="150" y="478" width="800" height="58" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="550" y="503" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">Precision = how CLEAN the results are.   Recall = how COMPLETE they are.</tspan></text><text x="550" y="525" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550" dy="0">Fishing analogy: precision = how much of your catch is fish; recall = how many of the fish you caught.</tspan></text></svg>
