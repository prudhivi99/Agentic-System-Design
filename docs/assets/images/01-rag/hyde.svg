<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-label="HyDE: the LLM writes a hypothetical answer to the question, that answer is embedded and used for vector search, and the real chunks found are used to answer."><title>HyDE: the LLM writes a hypothetical answer to the question, that answer is embedded and used for vector search, and the real chunks found are used to answer.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="498" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">HyDE: search with a made-up answer</tspan></text><path d="M264.4,64 C435.76,60 664.24,68 835.6,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Hypothetical Document Embeddings: questions and answers look different. Answers look like answers.</tspan></text><g transform="rotate(-1 140.0 215.0)"><rect x="43" y="155" width="200" height="130" rx="6" fill="#000" opacity="0.08"/><rect x="40" y="150" width="200" height="130" rx="6" fill="#FAD2E6" stroke="#00000014"/><rect x="112.0" y="141" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><path d="M122.0,178.0 h36.0 a4,4 0 0 1 4,4 v18.0 a4,4 0 0 1 -4,4 h-24.0 l-8.0,8.0 v-8.0 h-4.0 a4,4 0 0 1 -4,-4 v-18.0 a4,4 0 0 1 4,-4 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="140" y="195.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.0" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="140" dy="0">?</tspan></text><text x="140" y="245" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle" font-style="italic"><tspan x="140" dy="0">"how are free users</tspan><tspan x="140" dy="16.9">stopped?"</tspan></text><path d="M245,215 Q272.5,215.0 300,215" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(0.8 390.0 215.0)"><rect x="308" y="155" width="170" height="130" rx="6" fill="#000" opacity="0.08"/><rect x="305" y="150" width="170" height="130" rx="6" fill="#E0D9FB" stroke="#00000014"/><rect x="362.0" y="141" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><path d="M390,180.6 C381.0,175.2 368.4,184.2 373.8,193.2 C366.6,200.4 377.4,213.0 390,207.6 C402.6,213.0 413.4,200.4 406.2,193.2 C411.6,184.2 399.0,175.2 390,180.6 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2"/><path d="M390,180.6 V207.6 M381.0,191.4 q5,4 10,0 M399.0,198.6 q-5,-4 -10,0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="390" y="250" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="390" dy="0">LLM writes a</tspan></text><text x="390" y="268" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="390" dy="0">fake answer</tspan></text><path d="M480,215 Q507.5,215.0 535,215" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(-0.8 665.0 215.0)"><rect x="543" y="145" width="250" height="150" rx="6" fill="#000" opacity="0.08"/><rect x="540" y="140" width="250" height="150" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="560" y="168" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#4B5563" text-anchor="start"><tspan x="560" dy="0">hypothetical document</tspan></text><text x="560" y="194" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="560" dy="0">def check_limit(user):</tspan><tspan x="560" dy="16.2">  if count &gt;= limit:</tspan><tspan x="560" dy="16.2">    raise LimitError(...)</tspan></text><text x="560" y="270" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#DC2626" text-anchor="start" font-style="italic"><tspan x="560" dy="0">may be wrong: that's OK</tspan></text><path d="M795,215 Q822.5,215.0 850,215" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><text x="822" y="200" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="822" dy="0">embed</tspan></text><g transform="rotate(1 955.0 215.0)"><rect x="858" y="155" width="200" height="130" rx="6" fill="#000" opacity="0.08"/><rect x="855" y="150" width="200" height="130" rx="6" fill="#C9E0FB" stroke="#00000014"/><rect x="927.0" y="141" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><path d="M939.7,184.20000000000002 v21.599999999999998 a15.3,5.4 0 0 0 30.6,0 v-21.599999999999998" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2"/><ellipse cx="955" cy="184.20000000000002" rx="15.3" ry="5.4" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2"/><path d="M939.7,195.9 a15.3,5.4 0 0 0 30.6,0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="955" y="248" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="955" dy="0">vector search</tspan><tspan x="955" dy="17.6">→ REAL chunks</tspan></text><g transform="rotate(-0.3 550.0 405.0)"><rect x="113" y="350" width="880" height="120" rx="6" fill="#000" opacity="0.08"/><rect x="110" y="345" width="880" height="120" rx="6" fill="#FEF3A0" stroke="#00000014"/></g><text x="550" y="380" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">The fake answer is used only to SEARCH, never shown to the user.</tspan></text><text x="550" y="410" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">It sounds like real code, so it lands close to real code on the meaning map.</tspan></text><text x="550" y="438" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">The LLM then answers from the REAL chunks it found.</tspan></text></svg>
