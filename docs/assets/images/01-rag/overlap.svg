<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="1100" height="450" role="img" aria-label="Without overlap a check is split between two chunks; with overlap the border text appears in both chunks."><title>Without overlap a check is split between two chunks; with overlap the border text appears in both chunks.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="448" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Why overlap?</tspan></text><path d="M449.2,64 C509.68,60 590.3199999999999,68 650.8,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Neighbouring chunks share a little text, so an idea on the border isn't cut in half.</tspan></text><text x="60" y="160" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="60" dy="0">No overlap</tspan></text><circle cx="200" cy="154" r="10.4" fill="#DC2626"/><path d="M196.0,150.0 l8.0,8.0 M204.0,150.0 l-8.0,8.0" stroke="#fff" stroke-width="2.4000000000000004" stroke-linecap="round"/><rect x="60" y="180" width="480" height="60" rx="6" fill="#C9E0FB"/><rect x="540" y="180" width="500" height="60" rx="6" fill="#C6F0D2"/><path d="M540,170 v80" stroke="#DC2626" stroke-width="3" stroke-dasharray="5 4"/><text x="300" y="216" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="300" dy="0">chunk A: …limit = TASK_LIMITS.get(plan)</tspan></text><text x="790" y="216" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="790" dy="0">chunk B: current_count = … if &gt;= limit</tspan></text><text x="550" y="270" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#DC2626" text-anchor="middle"><tspan x="550" dy="0">"limit" is set in A but used in B: neither chunk has the whole check</tspan></text><text x="60" y="345" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="60" dy="0">With overlap</tspan></text><circle cx="215" cy="339" r="10.4" fill="#15803D"/><path d="M210.2,339 l3.6,4.0 l6.4,-8.0" fill="none" stroke="#fff" stroke-width="2.4000000000000004" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="335" width="440" height="34" rx="6" fill="#C9E0FB" opacity="0.9"/><rect x="560" y="375" width="480" height="34" rx="6" fill="#C6F0D2" opacity="0.9"/><rect x="560" y="335" width="130" height="74" rx="6" fill="none" stroke="#EA580C" stroke-width="3"/><text x="405" y="357" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="405" dy="0">chunk A</tspan></text><text x="870" y="397" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="870" dy="0">chunk B</tspan></text><text x="625" y="326" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#EA580C" text-anchor="middle"><tspan x="625" dy="0">shared text: the whole check is in one chunk</tspan></text></svg>
