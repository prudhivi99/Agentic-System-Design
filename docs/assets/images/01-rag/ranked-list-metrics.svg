ns-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="910" dy="0">1 / rank of FIRST useful</tspan></text><text x="910" y="433" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="910" dy="0">1 / 3 = 0.33</tspan></text><text x="770" y="515" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="770" dy="0">MRR = the average reciprocal rank over all your questions</tspan></text></svg>
