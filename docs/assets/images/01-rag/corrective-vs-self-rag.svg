<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Corrective RAG grades retrieved chunks with an evaluator and falls back to web search when they are bad; Self-RAG has the same model decide when to retrieve and critique relevance, support and usefulness of its own answer."><title>Corrective RAG grades retrieved chunks with an evaluator and falls back to web search when they are bad; Self-RAG has the same model decide when to retrieve and critique relevance, support and usefulness of its own answer.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="558" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Corrective RAG vs. Self-RAG</tspan></text><path d="M323.2,64 C459.28,60 640.72,68 776.8,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Two ways to add a check step. They check different things.</tspan></text><g transform="rotate(-0.6 290.0 325.0)"><rect x="53" y="135" width="480" height="390" rx="6" fill="#000" opacity="0.08"/><rect x="50" y="130" width="480" height="390" rx="6" fill="#C6F0D2" stroke="#00000014"/><rect x="262.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="80" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="80" dy="0">Corrective RAG (CRAG)</tspan></text><text x="80" y="198" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4B5563" text-anchor="start"><tspan x="80" dy="0">checks the CHUNKS, before answering</tspan></text><rect x="80" y="222" width="78" height="25" rx="12.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="119.12" y="238" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="119.12" dy="0">retrieve</tspan></text><path d="M168,235 Q181.5,235.0 195,235" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/><rect x="200" y="222" width="136" height="25" rx="12.5" fill="#FEF3A0" stroke="#1F2937" stroke-width="1.5"/><text x="268.24" y="238" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="268.24" dy="0">grade each chunk</tspan></text><text x="80" y="290" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic"><tspan x="80" dy="0">an evaluator (often a small, separate model)</tspan></text><circle cx="95" cy="330" r="10.4" fill="#15803D"/><path d="M90.2,330 l3.6,4.0 l6.4,-8.0" fill="none" stroke="#fff" stroke-width="2.4000000000000004" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="335" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="118" dy="0">good</tspan></text><text x="190" y="335" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="190" dy="0">→ use them (cleaned up)</tspan></text><circle cx="95" cy="376" r="10.4" fill="#D97706"/><text x="95" y="380.8" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.4" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="95" dy="0">!</tspan></text><text x="118" y="381" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="118" dy="0">unsure</tspan></text><text x="190" y="381" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="190" dy="0">→ use them + web search</tspan></text><circle cx="95" cy="422" r="10.4" fill="#DC2626"/><path d="M91.0,418.0 l8.0,8.0 M99.0,418.0 l-8.0,8.0" stroke="#fff" stroke-width="2.4000000000000004" stroke-linecap="round"/><text x="118" y="427" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="118" dy="0">bad</tspan></text><text x="190" y="427" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="190" dy="0">→ throw away, web search</tspan></text><text x="80" y="485" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="start"><tspan x="80" dy="0">Then generate the answer as usual.</tspan></text><g transform="rotate(0.6 810.0 325.0)"><rect x="573" y="135" width="480" height="390" rx="6" fill="#000" opacity="0.08"/><rect x="570" y="130" width="480" height="390" rx="6" fill="#C9E0FB" stroke="#00000014"/><rect x="782.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="600" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="600" dy="0">Self-RAG</tspan></text><text x="600" y="198" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4B5563" text-anchor="start"><tspan x="600" dy="0">the model checks ITSELF, step by step</tspan></text><circle cx="615" cy="240" r="13" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="615" y="244.94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.65" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="615" dy="0">1</tspan></text><text x="640" y="245" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="640" dy="0">Do I need to retrieve at all?</tspan></text><circle cx="615" cy="292" r="13" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="615" y="296.94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.65" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="615" dy="0">2</tspan></text><text x="640" y="297" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="640" dy="0">Is this chunk relevant?</tspan></text><circle cx="615" cy="344" r="13" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="615" y="348.94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.65" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="615" dy="0">3</tspan></text><text x="640" y="349" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="640" dy="0">Is my answer supported by it?</tspan></text><circle cx="615" cy="396" r="13" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="615" y="400.94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.65" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="615" dy="0">4</tspan></text><text x="640" y="401" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="640" dy="0">Is my answer useful?</tspan></text><text x="600" y="465" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic"><tspan x="600" dy="0">The same model answers and critiques,</tspan><tspan x="600" dy="17.6">trained to emit these checks itself.</tspan></text></svg>
