<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-label="Chunking cuts billing.py into small pieces, each about one topic; a question about the free plan limit returns only the TASK_LIMITS piece. Four reasons: precise, fits the model, cheaper, citable."><title>Chunking cuts billing.py into small pieces, each about one topic; a question about the free plan limit returns only the TASK_LIMITS piece. Four reasons: precise, fits the model, cheaper, citable.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="638" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Chunking: cut documents into pieces</tspan></text><path d="M256.0,64 C432.4,60 667.5999999999999,68 844.0,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">So search can return just the part that answers the question.</tspan></text><g transform="rotate(-1 175.0 290.0)"><rect x="63" y="145" width="230" height="300" rx="6" fill="#000" opacity="0.08"/><rect x="60" y="140" width="230" height="300" rx="6" fill="#FFFFFF" stroke="#00000014"/><rect x="147.0" y="131" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="175" y="172" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="175" dy="0">billing.py</tspan></text><rect x="85" y="190" width="180" height="30" rx="4" fill