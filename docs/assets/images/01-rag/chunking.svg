"round" stroke-linejoin="round" /><circle cx="356.7" cy="298.0" r="7.800000000000001" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M338.5,291.5 L358.0,264.2 M351.5,291.5 L332.0,264.2" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M310,330 Q347.5,330.0 385,330" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><text x="345" y="365" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="345" dy="0">chunk_size</tspan></text><g transform="rotate(-1.5 525.0 185.0)"><rect x="423" y="155" width="210" height="70" rx="6" fill="#000" opacity="0.08"/><rect x="420" y="150" width="210" height="70" rx="6" fill="#F3F4F6" stroke="#00000014"/></g><text x="525" y="192" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="525" dy="0">imports</tspan></text><g transform="rotate(1.2 755.0 185.0)"><rect x="653" y="155" width="210" height="70" rx="6" fill="#000" opacity="0.08"/><rect x="650" y="150" width="210" height="70" rx="6" fill="#F3F4F6" stroke="#00000014"/></g><text x="755" y="192" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="755" dy="0">class PlanTier</tspan></text><g transform="rotate(0.8 525.0 280.0)"><rect x="423" y="250" width="210" height="70" rx="6" fill="#000" opacity="0.08"/><rect x="420" y="245" width="210" height="70" rx="6" fill="#F3F4F6" stroke="#00000014"/></g><text x="525" y="287" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="525" dy="0">def get_plan(…)</tspan></text><g transform="rotate(-1 755.0 280.0)"><rect x="653" y="250" width="210" height="70" rx="6" fill="#000" opacity="0.08"/><rect x="650" y="245" width="210" height="70" rx="6" fill="#FEF3A0" stroke="#00000014"/></g><text x="755" y="287" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="755" dy="0">TASK_LIMITS = {FREE: 10…</tspan></text><g transform="rotate(1.4 525.0 375.0)"><rect x="423" y="345" width="210" height="70" rx="6" fill="#000" opacity="0.08"/><rect x="420" y="340" width="210" height="70" rx="6" fill="#FED9B4" stroke="#00000014"/></g><text x="525" y="382" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="525" dy="0">def check_task_limit(…)</tspan></text><g transform="rotate(-0.7 755.0 375.0)"><rect x="653" y="345" width="210" height="70" rx="6" fill="#000" opacity="0.08"/><rect x="650" y="340" width="210" height="70" rx="6" fill="#FED9B4" stroke="#00000014"/></g><text x="755" y="382" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="755" dy="0">if current_count &gt;= limit</tspan></text><text x="650" y="455" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="650" dy="0">6 small pieces, each about ONE thing</tspan></text><g transform="rotate(1.5 985.0 265.0)"><rect x="903" y="185" width="170" height="170" rx="6" fill="#000" opacity="0.08"/><rect x="900" y="180" width="170" height="170" rx="6" fill="#FAD2E6" stroke="#00000014"/><rect x="957.0" y="171" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><path d="M967.0,216.0 h36.0 a4,4 0 0 1 4,4 v18.0 a4,4 0 0 1 -4,4 h-24.0 l-8.0,8.0 v-8.0 h-4.0 a4,4 0 0 1 -4,-4 v-18.0 a4,4 0 0 1 4,-4 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="985" y="233.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.0" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="985" dy="0">?</tspan></text><text x="985" y="285" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" font-style="italic"><tspan x="985" dy="0">"What is the</tspan><tspan x="985" dy="18.2">free plan limit?"</tspan></text><path d="M898,290 Q883.0,286.0 868,282" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><text x="985" y="395" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle"><tspan x="985" dy="0">this piece is</tspan><tspan x="985" dy="18.2">the best match ✓</tspan></text><g transform="rotate(-0.8 177.5 560.0)"><rect x="63" y="515" width="235" height="100" rx="6" fill="#000" opacity="0.08"/><rect x="60" y="510" width="235" height="100" rx="6" fill="#C6F0D2" stroke="#00000014"/></g><circle cx="84" cy="538" r="13" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="84" y="542.94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.65" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="84" dy="0">1</tspan></text><text x="105" y="544" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="105" dy="0">Precise</tspan></text><text x="78" y="585" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="78" dy="0">1 piece = 1 topic, so it matches well</tspan></text><g transform="rotate(0.6 432.5 560.0)"><rect x="318" y="515" width="235" height="100" rx="6" fill="#000" opacity="0.08"/><rect x="315" y="510" width="235" 