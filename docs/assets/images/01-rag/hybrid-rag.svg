th="820" height="66" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="550" y="540" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">A and C appear in BOTH lists, so they rise to the top.</tspan></text><text x="550" y="564" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550" dy="0">Each list gives a chunk  weight / (60 + rank)  points; add them up. Equal weights shown.</tspan></text></svg>
