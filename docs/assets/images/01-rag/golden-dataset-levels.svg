ight="400" fill="#4B5563" text-anchor="middle"><tspan x="895" dy="0">scores per question type</tspan></text><g transform="rotate(-0.3 550.0 500.0)"><rect x="113" y="470" width="880" height="70" rx="6" fill="#000" opacity="0.08"/><rect x="110" y="465" width="880" height="70" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="550" y="495" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">Our module 01 test cases (T1–T10) are a golden dataset, close to "Best":</tspan></text><text x="550" y="520" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle" xml:space="preserve"><tspan x="550" dy="0">question · facts · must_retrieve / must_contain · group (no difficulty yet)</tspan></text></svg>
