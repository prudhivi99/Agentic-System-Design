<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Three levels of golden dataset: question and ground truth for generation metrics; plus relevant docs for retrieval metrics; plus type and difficulty to see where the system fails. Our T1 to T10 test cases are one."><title>Three levels of golden dataset: question and ground truth for generation metrics; plus relevant docs for retrieval metrics; plus type and difficulty to see where the system fails. Our T1 to T10 test cases are one.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="558" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">The golden dataset: questions with known right answers</tspan></text><path d="M96.39999999999998,64 C368.56,60 731.4399999999999,68 1003.6,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Like an exam answer key. More fields = more you can measure.</tspan></text><g transform="rotate(-0.8 205.0 280.0)"><rect x="53" y="135" width="310" height="300" rx="6" fill="#000" opacity="0.08"/><rect x="50" y="130" width="310" height="300" rx="6" fill="#FEF3A0" stroke="#00000014"/><rect x="177.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="78" cy="160" r="15" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="78" y="165.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.75"