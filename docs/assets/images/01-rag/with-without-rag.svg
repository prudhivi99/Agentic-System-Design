<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Without RAG the LLM guesses the free plan limit; with RAG it searches billing.py first and answers 10 tasks with a citation."><title>Without RAG the LLM guesses the free plan limit; with RAG it searches billing.py first and answers 10 tasks with a citation.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="558" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Without RAG vs. With RAG</tspan></text><path d="M348.4,64 C469.36,60 630.64,68 751.6,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Question: "How many tasks can a free user create?"</tspan></text><g transform="rotate(-0.8 285.0 325.0)"><rect x="53" y="135" width="470" height="390" rx="6" fill="#000" opacity="0.08"/><rect x="50" y="130" width="470" height="390" rx="6" fill="#FAD2E6" stroke="#00000014"/><rect x="257.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="90" cy="168" r="13.0" fill="#DC2626"/><path d="M85.0,163.0 l10.0,10.0 M95.0,163.0 l-10.0,10.0" stroke="#fff" stroke-width="3.0" stroke-linecap="round"/><text x="115" y="175" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="115" dy="0">Without RAG  ·  closed-book exam</tspan></text><path d="M112.0,241.0 h36.0 a4,4 0 0 1 4,4 v18.0 a4,4 0 0 1 -4,4 h-24.0 l-8.0,8.0 v-8.0 h-4.0 a4,4 0 0 1 -4,-4 v-18.0 a4,4 0 0 1 4,-4 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="130" y="258.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.0" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="130" dy="0">?</tspan></text><path d="M165,255 Q195.0,255.0 225,255" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M270,239.0 C260.0,233.0 246.0,243.0 252.0,253.0 C244.0,261.0 256.0,275.0 270,269.0 C284.0,275.0 296.0,261.0 288.0,253.0 C294.0,243.0 280.0,233.0 270,239.0 z" fill="#FBCFE8" stroke="#1F2937" stroke-width="2.2"/><path d="M270,239.0 V269.0 M260.0,251.0 q5,4 10,0 M280.0,259.0 q-5,-4 -10,0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="270" y="300" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="270" dy="0">LLM</tspan></text><path d="M305,255 Q335.0,255.0 365,255" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(1.5 435.0 257.5)"><rect x="373" y="215" width="130" height="95" rx="6" fill="#000" opacity="0.08"/><rect x="370" y="210" width="130" height="95" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="435" y="240" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" font-style="italic"><tspan x="435" dy="0">"Usually</tspan><tspan x="435" dy="18.2">around 5–10,</tspan><tspan x="435" dy="18.2">depends on…"</tspan></text><text x="80" y="365" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="80" dy="0">• Only knows its training data</tspan><tspan x="80" dy="20.8">• Never saw YOUR code</tspan><tspan x="80" dy="20.8">• So it guesses, confidently</tspan></text><text x="80" y="470" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#DC2626" text-anchor="start"><tspan x="80" dy="0">Result: a hallucination</tspan></text><g transform="rotate(0.8 815.0 325.0)"><rect x="583" y="135" width="470" height="390" rx="6" fill="#000" opacity="0.08"/><rect x="580" y="130" width="470" height="390" rx="6" fill="#C6F0D2" stroke="#00000014"/><rect x="787.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="620" cy="168" r="13.0" fill="#15803D"/><path d="M614.0,168 l4.5,5.0 l8.0,-10.0" fill="none" stroke="#fff" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><text x="645" y="175" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="645" dy="0">With RAG  ·  open-book exam</tspan></text><path d="M612.0,241.0 h36.0 a4,4 0 0 1 4,4 v18.0 a4,4 0 0 1 -4,4 h-24.0 l-8.0,8.0 v-8.0 h-4.0 a4,4 0 0 1 -4,-4 v-18.0 a4,4 0 0 1 4,-4 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="630" y="258.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.0" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="630" dy="0">?</tspan></text><path d="M663,255 Q676.5,255.0 690,255" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><circle cx="711.0" cy="251.0" r="11.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.4"/><path d="M719.0,259.0 l11.0,11.0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><text x="715" y="300" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="715" dy="0">search</tspan></text><path d="M742,255 Q756.0,255.0 770,255" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M780.0,236.0 h19.5 l10.5,10.5 v27.5 h-30.0 z" fill="#FEF3A0" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><path d="M786.0,252.0 h18.0 M786.0,259.0 h18.0 M786.0,266.0 h12.0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="795" y="300" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="795" dy="0">billing.py</tspan></text><path d="M818,255 Q832.0,255.0 846,255" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M880,239.0 C870.0,233.0 856.0,243.0 862.0,253.0 C854.0,261.0 866.0,275.0 880,269.0 C894.0,275.0 906.0,261.0 898.0,253.0 C904.0,243.0 890.0,233.0 880,239.0 z" fill="#FBCFE8" stroke="#1F2937" stroke-width="2.2"/><path d="M880,239.0 V269.0 M870.0,251.0 q5,4 10,0 M890.0,259.0 q-5,-4 -10,0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="880" y="300" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="880" dy="0">LLM</tspan></text><path d="M912,255 Q923.5,255.0 935,255" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(-1.5 989.0 257.5)"><rect x="943" y="215" width="98" height="95" rx="6" fill="#000" opacity="0.08"/><rect x="940" y="210" width="98" height="95" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="989" y="240" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="middle" font-style="italic"><tspan x="989" dy="0">