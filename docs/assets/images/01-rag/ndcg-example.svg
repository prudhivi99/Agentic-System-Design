<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="NDCG example: the same three chunks in a bad order give DCG 3.76 and NDCG 0.79; in the best order DCG 4.76 and NDCG 1.00, because lower ranks are divided by a bigger discount."><title>NDCG example: the same three chunks in a bad order give DCG 3.76 and NDCG 0.79; in the best order DCG 4.76 and NDCG 1.00, because lower ranks are divided by a bigger discount.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="558" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">NDCG: are the BEST chunks at the top?</tspan></text><path d="M239.2,64 C425.67999999999995,60 674.3199999999999,68 860.8,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Same 3 chunks, two orders. Usefulness: D1 = 3 (the answer), D2 = 2, D3 = 1.</tspan></text><g transform="rotate(-0.6 290.0 300.0)"><rect x="63" y="135" width="460" height="340" rx="6" fill="#000" opacity="0.08"/><rect x="60" y="130" width="460" height="340" rx="6" fill="#FAD2E6" stroke="#00000014"/><rect x="262.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="90" y="170" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="90" dy="0">Bad order</tspan></text><text x="90" y="200" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start" xml:space="preserve"><tspan x="90" dy="0">rank   chunk   usefulness ÷ discount</tspan></text><circle cx="105" cy="242" r="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="105" y="247.32" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.700000000000001" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="105" dy="0">1</tspan></text><text x="145" y="249" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="800" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="145" dy="0">D3</tspan></text><rect x="200" y="226" width="55" height="32" rx="5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="263" y="249" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="263" dy="0">1 ÷ 1.0 = 1.00</tspan></text><circle cx="105" cy="304" r="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="105" y="309.32" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.700000000000001" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="105" dy="0">2</tspan></text><text x="145" y="311" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="800" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="145" dy="0">D2</tspan></text><rect x="200" y="288" width="110" height="32" rx="5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="318" y="311" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="318" dy="0">2 ÷ 1.585 = 1.26</tspan></text><circle cx="105" cy="366" r="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="105" y="371.32" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.700000000000001" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="105" dy="0">3</tspan></text><text x="145" y="373" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="800" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="145" dy="0">D1</tspan></text><rect x="200" y="350" width="165" height="32" rx="5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="373" y="373" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="373" dy="0">3 ÷ 2.0 = 1.50</tspan></text><path d="M90,410 h400" stroke="#00000030"/><text x="90" y="445" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="90" dy="0">DCG = 3.76</tspan></text><text x="490" y="445" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="800" fill="#DC2626" text-anchor="end" xml:space="preserve"><tspan x="490" dy="0">NDCG = 0.79</tspan></text><g transform="rotate(0.6 810.0 300.0)"><rect x="583" y="135" width="460" height="340" rx="6" fill="#000" opacity="0.08"/><rect x="580" y="130" width="460" height="340" rx="6" fill="#C6F0D2" stroke="#00000014"/><rect x="782.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="610" y="170" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="610" dy="0">Good order</tspan></text><text x="610" y="200" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start" xml:space="preserve"><tspan x="610" dy="0">rank   chunk   usefulness ÷ discount</tspan></text><circle cx="625" cy="242" r="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="625" y="247.32" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.700000000000001" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="625" dy="0">1</tspan></text><text x="665" y="249" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="800" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="665" dy="0">D1</tspan></text><rect x="720" y="226" width="165" height="32" rx="5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="893" y="249" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="893" dy="0">3 ÷ 1.0 = 3.00</tspan></text><circle cx="625" cy="304" r="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="625" y="309.32" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.700000000000001" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="625" dy="0">2</tspan></text><text x="665" y="311" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="800" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="665" dy="0">D2</tspan></text><rect x="720" y="288" width="110" height="32" rx="5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="838" y="311" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="838" dy="0">2 ÷ 1.585 = 1.26</tspan></text><circle cx="625" cy="366" r="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="625" y="371.32" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.700000000000001" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="625" dy="0">3</tspan></text><text x="665" y="373" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="800" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="665" dy="0">D3</tspan></text><rect x="720" y="350" width="55" height="32" rx="5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="783" y="373" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="783" dy="0">1 ÷ 2.0 = 0.50</tspan></text><path d="M610,410 h400" stroke="#00000030"/><text x="610" y="445" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="800" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="610" dy="0">DCG = 4.76</tspan></text><text x="1010" y="445" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="800" fill="#15803D" text-anchor="end" xml:space="preserve"><tspan x="1010" dy="0">NDCG = 1.00</tspan></text><g transform="rotate(-0.3 550.0 516.0)"><rect x="113" y="495" width="880" height="52" rx="6" fill="#000" opacity="0.08"/><rect x="110" y="490" width="880" height="52" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="550" y="522" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">Lower ranks count less (÷ discount).  NDCG = DCG ÷ DCG of the perfect order (4.76).</tspan></text></svg>
