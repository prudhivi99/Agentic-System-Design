<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-label="Documents are flipped into an inverted index that maps each word to the documents containing it; the query word invoice looks up one row and gets D0 and D3."><title>Documents are flipped into an inverted index that maps each word to the documents containing it; the query word invoice looks up one row and gets D0 and D3.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="538" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">The inverted index: word → documents</tspan></text><path d="M247.59999999999997,64 C429.03999999999996,60 670.96,68 852.4000000000001,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">3 of the 5 docs from 1_bm25_visualization.py. Built once, then lookups are instant.</tspan></text><text x="60" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#4B5563" text-anchor="start"><tspan x="60" dy="0">Documents (forward: doc → words)</tspan></text><g transform="rotate(-0.8 255.0 200.0)"><rect x="58" y="165" width="400" height="80" rx="6" fill="#000" opacity="0.08"/><rect x="55" y="160" width="400" height="80" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="78" y="192" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#EA580C" text-anchor="start" xml:space="preserve"><tspan x="78" dy="0">D0</tspan></text><text x="125" y="192" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="125" dy="0">create_invoice  generate invoice</tspan><tspan x="125" dy="16.9">for order  calculate invoice total</tspan></text><g transform="rotate(0.6 255.0 300.0)"><rect x="58" y="265" width="400" height="80" rx="6" fill="#000" opacity="0.08"/><rect x="55" y="260" width="400" height="80" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="78" y="292" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#EA580C" text-anchor="start" xml:space="preserve"><tspan x="78" dy="0">D1</tspan></text><text x="125" y="292" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="125" dy="0">create_payment  process payment</tspan><tspan x="125" dy="16.9">validate payment method  charge card</tspan></text><g transform="rotate(-0.5 255.0 400.0)"><rect x="58" y="365" width="400" height="80" rx="6" fill="#000" opacity="0.08"/><rect x="55" y="360" width="400" height="80" rx="6" fill="#FFFFFF" stroke="#00000014"/></g><text x="78" y="392" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="800" fill="#EA580C" text-anchor="start" xml:space="preserve"><tspan x="78" dy="0">D3</tspan></text><text x="125" y="392" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#1F2937" text-anchor="start" xml:space="preserve"><tspan x="125" dy="0">send_invoice  email invoice</tspan><tspan x="125" dy="16.9">to customer  attach invoice pdf</tspan></text><path d="M470,300 Q507.5,300.0 545,300" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><text x="508" y="285" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4B5563" text-anchor="middle"><tspan x="508" dy="0">flip it</tspan></text><text x="570" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#4B5563" text-anchor="start"><tspan x="570" dy="0">Inverted index (word → docs)</tspan></text><rect x="570" y="160" width="170" height="44" rx="6" fill="#FEF3A0" stroke="#00000022"/><text x="655" y="188" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="655" dy="0">invoice</tspan></text><path d="M745,182 h30" stroke="#1F2937" stroke-width="2" marker-end="url(#head)"/><rect x="782" y="160" width="200" height="44" rx="6" fill="#FEF3A0" stroke="#00000022"/><text x="882" y="188" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="882" dy="0">D0 (×2) · D3 (×2)</tspan></text><rect x="570" y="218" width="170" height="44" rx="6" fill="#FFFFFF" stroke="#00000022"/><text x="655" y="246" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="655" dy="0">payment</tspan></text><path d="M745,240 h30" stroke="#1F2937" stroke-width="2" marker-end="url(#head)"/><rect x="782" y="218" width="200" height="44" rx="6" fill="#FFFFFF" stroke="#00000022"/><text x="882" y="246" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="882" dy="0">D1 (×2)</tspan></text><rect x="570" y="276" width="170" height="44" rx="6" fill="#FFFFFF" stroke="#00000022"/><text x="655" y="304" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="655" dy="0">customer</tspan></text><path d="M745,298 h30" stroke="#1F2937" stroke-width="2" marker-end="url(#head)"/><rect x="782" y="276" width="200" height="44" rx="6" fill="#FFFFFF" stroke="#00000022"/><text x="882" y="304" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="882" dy="0">D3</tspan></text><rect x="570" y="334" width="170" height="44" rx="6" fill="#FFFFFF" stroke="#00000022"/><text x="655" y="362" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="655" dy="0">generate</tspan></text><path d="M745,356 h30" stroke="#1F2937" stroke-width="2" marker-end="url(#head)"/><rect x="782" y="334" width="200" height="44" rx="6" fill="#FFFFFF" stroke="#00000022"/><text x="882" y="362" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="882" dy="0">D0</tspan></text><rect x="570" y="392" width="170" height="44" rx="6" fill="#FFFFFF" stroke="#00000022"/><text x="655" y="420" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="655" dy="0">card</tspan></text><path d="M745,414 h30" stroke="#1F2937" stroke-width="2" marker-end="url(#head)"/><rect x="782" y="392" width="200" height="44" rx="6" fill="#FFFFFF" stroke="#00000022"/><text x="882" y="420" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="882" dy="0">D1</tspan></text><g transform="rotate(-0.4 795.0 490.0)"><rect x="563" y="467" width="470" height="56" rx="6" fill="#000" opacity="0.08"/><rect x="560" y="462" width="470" height="56" rx="6" fill="#FAD2E6" stroke="#00000014"/></g><text x="795" y="496" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="795" dy="0">query "invoice"  →  look up 1 row  →  D0, D3</tspan></text><text x="255" y="492" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="255" dy="0">Like the index at the back of a book:</tspan><tspan x="255" dy="18.2">word → pages, so you never read every page.</tspan></text></svg>
