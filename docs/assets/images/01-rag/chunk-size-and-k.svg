<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" role="img" aria-label="Four combinations: small chunks and small k gives fragments; small chunks and big k gives many precise pieces; big chunks and small k gives whole units; big chunks and big k is too much. Rule: small chunks need a bigger k."><title>Four combinations: small chunks and small k gives fragments; small chunks and big k gives many precise pieces; big chunks and small k gives whole units; big chunks and big k is too much. Rule: small chunks need a bigger k.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="758" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Chunk size × k: the 4 combinations</tspan></text><path d="M264.4,64 C435.76,60 664.24,68 835.6,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">k = how many pieces come back   ·   chunk size = how big each piece is</tspan></text><text x="445" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="445" dy="0">SMALL k  (e.g. 2)</tspan></text><text x="835" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="835" dy="0">BIG k  (e.g. 10)</tspan></text><text x="120" y="260" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="120" dy="0">SMALL</tspan><tspan x="120" dy="22.1">chunks</tspan><tspan x="120" dy="22.1">(256)</tspan></text><text x="120" y="500" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="120" dy="0">BIG</tspan><tspan x="120" dy="22.1">chunks</tspan><tspan x="120" dy="22.1">(1024)</tspan></text><g transform="rotate(-0.8 435.0 267.5)"><rect x="253" y="165" width="370" height="215" rx="6" fill="#000" opacity="0.08"/><rect x="250" y="160" width="370" height="215" rx="6" fill="#FAD2E6" stroke="#00000014"/><rect x="407.0" y="151" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="280" cy="194" r="13.0" fill="#DC2626"/><path d="M275.0,189.0 l10.0,10.0 M285.0,189.0 l-10.0,10.0" stroke="#fff" stroke-width="3.0" stroke-linecap="round"/><text x="304" y="201" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="304" dy="0">Too little</tspan></text><rect x="290" y="225" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="322" y="225" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="354" y="225" width="26" height="26" rx="3" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="386" y="225" width="26" height="26" rx="3" fill="none" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="4 3"/><text x="420" y="244" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="start" font-style="italic"><tspan x="420" dy="0">missing pieces</tspan></text><text x="595" y="360" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="end" font-style="italic"><tspan x="595" dy="0">≈ 2 × 80 tokens</tspan></text><text x="272" y="285" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="272" dy="0">Answer comes back in fragments.</tspan><tspan x="272" dy="18.9">Parts are missing → incomplete,</tspan><tspan x="272" dy="18.9">or the LLM guesses the rest.</tspan></text><g transform="rotate(0.7 825.0 267.5)"><rect x="643" y="165" width="370" height="215" rx="6" fill="#000" opacity="0.08"/><rect x="640" y="160" width="370" height="215" rx="6" fill="#C6F0D2" stroke="#00000014"/><rect x="797.0" y="151" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="670" cy="194" r="13.0" fill="#15803D"/><path d="M664.0,194 l4.5,5.0 l8.0,-10.0" fill="none" stroke="#fff" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><text x="694" y="201" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="694" dy="0">Many precise pieces</tspan></text><rect x="680" y="225" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="712" y="225" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="744" y="225" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="776" y="225" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="808" y="225" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="840" y="225" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="872" y="225" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="904" y="225" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="936" y="225" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="968" y="225" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><text x="985" y="360" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="end" font-style="italic"><tspan x="985" dy="0">≈ 10 × 80 tokens</tspan></text><text x="662" y="285" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="662" dy="0">Small focused pieces that together</tspan><tspan x="662" dy="18.9">cover the answer.</tspan><tspan x="662" dy="18.9">A few unrelated pieces too.</tspan></text><g transform="rotate(0.6 435.0 507.5)"><rect x="253" y="405" width="370" height="215" rx="6" fill="#000" opacity="0.08"/><rect x="250" y="400" width="370" height="215" rx="6" fill="#C6F0D2" stroke="#00000014"/><rect x="407.0" y="391" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="280" cy="434" r="13.0" fill="#15803D"/><path d="M274.0,434 l4.5,5.0 l8.0,-10.0" fill="none" stroke="#fff" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/><text x="304" y="441" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="304" dy="0">Whole units</tspan></text><rect x="290" y="465" width="140" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="436" y="465" width="140" height="26" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><text x="595" y="600" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="end" font-style="italic"><tspan x="595" dy="0">≈ 2 × 280 tokens</tspan></text><text x="272" y="525" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="272" dy="0">Full functions, nothing cut in half.</tspan><tspan x="272" dy="18.9">But a 3rd file is never seen,</tspan><tspan x="272" dy="18.9">and matching gets blurrier.</tspan></text><g transform="rotate(-0.7 825.0 507.5)"><rect x="643" y="405" width="370" height="215" rx="6" fill="#000" opacity="0.08"/><rect x="640" y="400" width="370" height="215" rx="6" fill="#FAD2E6" stroke="#00000014"/><rect x="797.0" y="391" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="670" cy="434" r="13.0" fill="#DC2626"/><path d="M665.0,429.0 l10.0,10.0 M675.0,429.0 l-10.0,10.0" stroke="#fff" stroke-width="3.0" stroke-linecap="round"/><text x="694" y="441" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="694" dy="0">Too much</tspan></text><rect x="680" y="461" width="52" height="13" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="736" y="461" width="52" height="13" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="792" y="461" width="52" height="13" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="848" y="461" width="52" height="13" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="904" y="461" width="52" height="13" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="680" y="478" width="52" height="13" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="736" y="478" width="52" height="13" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="792" y="478" width="52" height="13" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="848" y="478" width="52" height="13" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><rect x="904" y="478" width="52" height="13" rx="3" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.4"/><text x="985" y="600" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563" text-anchor="end" font-style="italic"><tspan x="985" dy="0">≈ 10 × 280 tokens</tspan></text><text x="662" y="525" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="662" dy="0">The answer is in there, buried</tspan><tspan x="662" dy="18.9">in noise. Slow, costly, and the</tspan><tspan x="662" dy="18.9">LLM may quote the wrong code.</tspan></text><g transform="rotate(-0.4 550.0 690.0)"><rect x="153" y="655" width="800" height="80" rx="6" fill="#000" opacity="0.08"/><rect x="150" y="650" width="800" height="80" rx="6" fill="#FEF3A0" stroke="#00000014"/><rect x="522.0" y="641" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="550" y="683" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">Rule of thumb:  small chunks → need a bigger k   ·   big chunks → can use a smaller k</tspan></text><text x="550" y="711" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550" dy="0">Then measure: pick the SMALLEST settings that still find the answer.</tspan></text></svg>
