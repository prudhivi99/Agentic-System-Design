<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-label="ASTs are used by compilers and interpreters, linters, IDEs, and code RAG."><title>ASTs are used by compilers and interpreters, linters, IDEs, and code RAG.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="398" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Where else are ASTs used?</tspan></text><path d="M340.0,64 C466.0,60 634.0,68 760.0,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Any tool that needs to UNDERSTAND code, not just read text.</tspan></text><g transform="rotate(-0.8 167.5 245.0)"><rect x="53" y="135" width="235" height="230" rx="6" fill="#000" opacity="0.08"/><rect x="50" y="130" width="235" height="230" rx="6" fill="#C9E0FB" stroke="#00000014"/><rect x="139.5" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="76" cy="158" r="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="76" y="163.32" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.700000000000001" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="76" dy="0">1</tspan></text><path d="M167,191.0 Q167,205 181.0,205 Q167,205 167,219.0 Q167,205 153.0,205 Q167,205 167,191.0 z" fill="#FDE047" stroke="#1F2937" stroke-width="2"/><path d="M182.0,187.0 Q182.0,193.0 188.0,193.0 Q182.0,193.0 182.0,199.0 Q182.0,193.0 176.0,193.0 Q182.0,193.0 182.0,187.0 z" fill="#FDE047" stroke="#1F2937" stroke-width="2"/><text x="167" y="265" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="167" dy="0">Compilers and interpreters</tspan></text><text x="167" y="295" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="167" dy="0">turn code into something</tspan><tspan x="167" dy="17.6">the computer runs</tspan></text><g transform="rotate(0.6 422.5 245.0)"><rect x="308" y="135" width="235" height="230" rx="6" fill="#000" opacity="0.08"/><rect x="305" y="130" width="235" height="230" rx="6" fill="#C6F0D2" stroke="#00000014"/><rect x="394.5" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="331" cy="158" r="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="331" y="163.32" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.700000000000001" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="331" dy="0">2</tspan></text><path d="M422,187.0 l15.0,6.0 v9.0 c0,10.0 -7.0,16.0 -15.0,19.0 c-8.0,-3.0 -15.0,-9.0 -15.0,-19.0 v-9.0 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><path d="M416.0,205 l4.0,5.0 l8.0,-9.0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke="#15803D"/><text x="422" y="265" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="422" dy="0">Linters and checkers</tspan></text><text x="422" y="295" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="422" dy="0">spot bugs and style</tspan><tspan x="422" dy="17.6">problems (e.g. Ruff)</tspan></text><g transform="rotate(-0.5 677.5 245.0)"><rect x="563" y="135" width="235" height="230" rx="6" fill="#000" opacity="0.08"/><rect x="560" y="130" width="235" height="230" rx="6" fill="#E0D9FB" stroke="#00000014"/><rect x="649.5" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="586" cy="158" r="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="586" y="163.32" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.700000000000001" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="586" dy="0">3</tspan></text><rect x="673.0" y="186.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(0 677 205)"/><rect x="673.0" y="186.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(45 677 205)"/><rect x="673.0" y="186.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(90 677 205)"/><rect x="673.0" y="186.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(135 677 205)"/><rect x="673.0" y="186.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(180 677 205)"/><rect x="673.0" y="186.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(225 677 205)"/><rect x="673.0" y="186.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(270 677 205)"/><rect x="673.0" y="186.0" width="8.0" height="9.0" rx="1.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="2" transform="rotate(315 677 205)"/><circle cx="677" cy="205" r="12.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2"/><circle cx="677" cy="205" r="4.5" fill="none" stroke="#1F2937" stroke-width="2.2"/><text x="677" y="265" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="677" dy="0">IDEs</tspan></text><text x="677" y="295" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="677" dy="0">autocomplete, rename,</tspan><tspan x="677" dy="17.6">go to definition</tspan></text><g transform="rotate(0.8 932.5 245.0)"><rect x="818" y="135" width="235" height="230" rx="6" fill="#000" opacity="0.08"/><rect x="815" y="130" width="235" height="230" rx="6" fill="#FEF3A0" stroke="#00000014"/><rect x="904.5" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="841" cy="158" r="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="841" y="163.32" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.700000000000001" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="841" dy="0">4</tspan></text><circle cx="928.0" cy="201.0" r="11.0" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.4"/><path d="M936.0,209.0 l11.0,11.0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><text x="932" y="265" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="932" dy="0">Code RAG (us!)</tspan></text><text x="932" y="295" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="932" dy="0">cut code into whole</tspan><tspan x="932" dy="17.6">classes and functions</tspan></text></svg>
