<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Hybrid RAG sends the question to several retrievers with different strengths, then merges and ranks their results into one final context for the LLM."><title>Hybrid RAG sends the question to several retrievers with different strengths, then merges and ranks their results into one final context for the LLM.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="558" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Hybrid RAG is an architecture, not one technique</tspan></text><path d="M146.79999999999995,64 C388.71999999999997,60 711.28,68 953.2,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Several retrievers, each with a different strength, merged into one final context.</tspan></text><g transform="rotate(-1 120.0 275.0)"><rect x="43" y="220" width="160" height="120" rx="6" fill="#000" opacity="0.08"/><rect x="40" y="215" width="160" height="120" rx="6" fill="#FAD2E6" stroke="#00000014"/><rect x="92.0" y="206" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><path d="M102.0,241.0 h36.0 a4,4 0 0 1 4,4 v18.0 a4,4 0 0 1 -4,4 h-24.0 l-8.0,8.0 v-8.0 h-4.0 a4,4 0 0 1 -4,-4 v-18.0 a4,4 0 0 1 4,-4 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="120" y="258.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.0" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="120" dy="0">?</tspan></text><text x="120" y="310" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="120" dy="0">question</tspan></text><path d="M205,275 Q245.0,227.5 285,180" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(0 435.0 181.0)"><rect x="293" y="145" width="290" height="82" rx="6" fill="#000" opacity="0.08"/><rect x="290" y="140" width="290" height="82" rx="6" fill="#FEF3A0" stroke="#00000014"/></g><text x="312" y="173" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="312" dy="0">Retriever 1</tspan></text><text x="312" y="200" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="312" dy="0">e.g. lexical: exact words</tspan></text><path d="M585,180 Q625.0,227.5 665,275" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M205,275 Q245.0,285.0 285,295" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(0 435.0 296.0)"><rect x="293" y="260" width="290" height="82" rx="6" fill="#000" opacity="0.08"/><rect x="290" y="255" width="290" height="82" rx="6" fill="#C9E0FB" stroke="#00000014"/></g><text x="312" y="288" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="312" dy="0">Retriever 2</tspan></text><text x="312" y="315" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="312" dy="0">e.g. semantic: meaning</tspan></text><path d="M585,295 Q625.0,285.0 665,275" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M205,275 Q245.0,342.5 285,410" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(0 435.0 411.0)"><rect x="293" y="375" width="290" height="82" rx="6" fill="#000" opacity="0.08"/><rect x="290" y="370" width="290" height="82" rx="6" fill="#C6F0D2" stroke="#00000014"/></g><text x="312" y="403" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="312" dy="0">Retriever N</tspan></text><text x="312" y="430" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="start"><tspan x="312" dy="0">graph, SQL, another model…</tspan></text><path d="M585,410 Q625.0,342.5 665,275" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(0.8 755.0 275.0)"><rect x="673" y="210" width="170" height="140" rx="6" fill="#000" opacity="0.08"/><rect x="670" y="205" width="170" height="140" rx="6" fill="#FED9B4" stroke="#00000014"/><rect x="727.0" y="196" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="755" y="262" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="755" dy="0">Merge</tspan><tspan x="755" dy="22.1">+ rank</tspan></text><text x="755" y="318" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="755" dy="0">e.g. RRF</tspan></text><path d="M845,275 Q870.0,275.0 895,275" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><g transform="rotate(-0.8 980.0 275.0)"><rect x="903" y="220" width="160" height="120" rx="6" fill="#000" opacity="0.08"/><rect x="900" y="215" width="160" height="120" rx="6" fill="#FFFFFF" stroke="#00000014"/><rect x="952.0" y="206" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><path d="M944.0,241.04 h12.480000000000002 l6.720000000000001,6.720000000000001 v17.6 h-19.200000000000003 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><path d="M947.84,251.28 h11.520000000000001 M947.84,255.76 h11.520000000000001 M947.84,260.24 h7.68" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M950.4,245.84 h12.480000000000002 l6.720000000000001,6.720000000000001 v17.6 h-19.200000000000003 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><path d="M954.24,256.08 h11.520000000000001 M954.24,260.56 h11.520000000000001 M954.24,265.04 h7.68" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M956.8,250.64000000000001 h12.480000000000002 l6.720000000000001,6.720000000000001 v17.6 h-19.200000000000003 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><path d="M960.64,260.88 h11.520000000000001 M960.64,265.36 h11.520000000000001 M960.64,269.84000000000003 h7.68" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="980" y="310" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="980" dy="0">final context</tspan></text><text x="980" y="365" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="980" dy="0">→ LLM</tspan></text><g transform="rotate(-0.3 550.0 509.0)"><rect x="153" y="490" width="800" height="48" rx="6" fill="#000" opacity="0.08"/><rect x="150" y="485" width="800" height="48" rx="6" fill="#FEF3A0" stroke="#00000014"/></g><text x="550" y="516" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">Each retriever covers what the others miss.</tspan></text></svg>
