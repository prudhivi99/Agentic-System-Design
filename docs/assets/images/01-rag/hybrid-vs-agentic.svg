<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-label="Hybrid RAG always runs semantic and BM25 search and merges them; agentic RAG lets the LLM choose which search tool to call for each question."><title>Hybrid RAG always runs semantic and BM25 search and merges them; agentic RAG lets the LLM choose which search tool to call for each question.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="498" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">Two ways to use both searches</tspan></text><path d="M306.4,64 C452.55999999999995,60 647.44,68 793.6,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Fixed hybrid pipeline, or let an agent choose.</tspan></text><g transform="rotate(-0.6 290.0 295.0)"><rect x="53" y="135" width="480" height="330" rx="6" fill="#000" opacity="0.08"/><rect x="50" y="130" width="480" height="330" rx="6" fill="#C6F0D2" stroke="#00000014"/><rect x="262.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="80" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="80" dy="0">Hybrid RAG  ·  always both</tspan></text><path d="M92.0,231.0 h36.0 a4,4 0 0 1 4,4 v18.0 a4,4 0 0 1 -4,4 h-24.0 l-8.0,8.0 v-8.0 h-4.0 a4,4 0 0 1 -4,-4 v-18.0 a4,4 0 0 1 4,-4 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="110" y="248.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.0" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="110" dy="0">?</tspan></text><path d="M140,235 Q170.0,220.0 200,205" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M140,255 Q170.0,270.0 200,285" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><rect x="205" y="190" width="78" height="25" rx="12.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="244.12" y="206" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="244.12" dy="0">semantic</tspan></text><rect x="205" y="270" width="49" height="25" rx="12.5" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="229.56" y="286" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="229.56" dy="0">BM25</tspan></text><path d="M300,205 Q322.5,220.0 345,235" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M275,285 Q310.0,270.0 345,255" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><rect x="350" y="230" width="56" height="25" rx="12.5" fill="#FEF3A0" stroke="#1F2937" stroke-width="1.5"/><text x="378.2" y="246" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="378.2" dy="0">merge</tspan></text><text x="80" y="350" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="80" dy="0">• Your code runs both on every question</tspan><tspan x="80" dy="19.5">• Simple, predictable, one LLM call</tspan><tspan x="80" dy="19.5">• Pays for both searches every time</tspan></text><g transform="rotate(0.6 810.0 295.0)"><rect x="573" y="135" width="480" height="330" rx="6" fill="#000" opacity="0.08"/><rect x="570" y="130" width="480" height="330" rx="6" fill="#C9E0FB" stroke="#00000014"/><rect x="782.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="600" y="172" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#1F2937" text-anchor="start"><tspan x="600" dy="0">Agentic RAG  ·  the LLM picks</tspan></text><path d="M612.0,231.0 h36.0 a4,4 0 0 1 4,4 v18.0 a4,4 0 0 1 -4,4 h-24.0 l-8.0,8.0 v-8.0 h-4.0 a4,4 0 0 1 -4,-4 v-18.0 a4,4 0 0 1 4,-4 z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="630" y="248.0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.0" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="630" dy="0">?</tspan></text><path d="M660,245 Q680.0,245.0 700,245" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M735,230.6 C726.0,225.2 713.4,234.2 718.8,243.2 C711.6,250.4 722.4,263.0 735,257.6 C747.6,263.0 758.4,250.4 751.2,243.2 C756.6,234.2 744.0,225.2 735,230.6 z" fill="#FBCFE8" stroke="#1F2937" stroke-width="2.2"/><path d="M735,230.6 V257.6 M726.0,241.4 q5,4 10,0 M744.0,248.6 q-5,-4 -10,0" fill="none" stroke="#1F2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="735" y="285" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="735" dy="0">agent</tspan></text><path d="M765,228 Q790.0,214.0 815,200" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M767,245 Q791.0,245.0 815,245" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><path d="M765,262 Q790.0,276.0 815,290" fill="none" stroke="#1F2937" stroke-width="2.4" stroke-linecap="round" marker-end="url(#head)"/><rect x="820" y="186" width="125" height="24.5" rx="12.25" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="882.5" y="201.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="882.5" dy="0">semantic_search</tspan></text><rect x="820" y="232" width="118" height="24.5" rx="12.25" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="879.0" y="247.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="879.0" dy="0">keyword_search</tspan></text><rect x="820" y="278" width="97" height="24.5" rx="12.25" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/><text x="868.5" y="293.5" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="868.5" dy="0">sql / api …</tspan></text><text x="600" y="350" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="start"><tspan x="600" dy="0">• "AuthService" → keyword_search</tspan><tspan x="600" dy="19.5">• "why can't free users…" → semantic_search</tspan><tspan x="600" dy="19.5">• Can retry if a result isn't good enough</tspan></text></svg>
