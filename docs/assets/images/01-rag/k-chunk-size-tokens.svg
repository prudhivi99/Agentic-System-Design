<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="k is how many chunks come back, chunk size is how big each chunk is in characters, tokens are the text pieces the LLM reads. Tokens sent is roughly k times tokens per chunk."><title>k is how many chunks come back, chunk size is how big each chunk is in characters, tokens are the text pieces the LLM reads. Tokens sent is roughly k times tokens per chunk.</title><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker></defs><rect x="1" y="1" width="1098" height="558" rx="20" fill="#FBF7EF" stroke="#E7DFD0" stroke-width="2"/><text x="550.0" y="52" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1F2937" text-anchor="middle"><tspan x="550.0" dy="0">k, chunk size and tokens are NOT the same</tspan></text><path d="M205.59999999999997,64 C412.24,60 687.76,68 894.4000000000001,63" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/><text x="550.0" y="94" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550.0" dy="0">Three different things, measured in three different units.</tspan></text><g transform="rotate(-1 210.0 255.0)"><rect x="63" y="135" width="300" height="250" rx="6" fill="#000" opacity="0.08"/><rect x="60" y="130" width="300" height="250" rx="6" fill="#C9E0FB" stroke="#00000014"/><rect x="182.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="90" cy="162" r="15" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="90" y="167.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.75" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="90" dy="0">1</tspan></text><text x="210" y="210" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="210" dy="0">k</tspan></text><text x="210" y="245" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="210" dy="0">HOW MANY chunks come back</tspan></text><text x="210" y="272" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="210" dy="0">unit: chunks</tspan></text><rect x="90" y="290" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#00000020"/><text x="210" y="316" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="210" dy="0">k = 3</tspan></text><text x="210" y="358" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="210" dy="0">you choose it in code</tspan></text><g transform="rotate(0.6 550.0 255.0)"><rect x="403" y="135" width="300" height="250" rx="6" fill="#000" opacity="0.08"/><rect x="400" y="130" width="300" height="250" rx="6" fill="#FEF3A0" stroke="#00000014"/><rect x="522.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="430" cy="162" r="15" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="430" y="167.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.75" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="430" dy="0">2</tspan></text><text x="550" y="210" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="550" dy="0">chunk_size</tspan></text><text x="550" y="245" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">HOW BIG each chunk is</tspan></text><text x="550" y="272" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="550" dy="0">unit: characters (in our code)</tspan></text><rect x="430" y="290" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#00000020"/><text x="550" y="316" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="550" dy="0">256 characters</tspan></text><text x="550" y="358" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="550" dy="0">you choose it in code</tspan></text><g transform="rotate(-0.5 890.0 255.0)"><rect x="743" y="135" width="300" height="250" rx="6" fill="#000" opacity="0.08"/><rect x="740" y="130" width="300" height="250" rx="6" fill="#FAD2E6" stroke="#00000014"/><rect x="862.0" y="121" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><circle cx="770" cy="162" r="15" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="770" y="167.7" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.75" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="770" dy="0">3</tspan></text><text x="890" y="210" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="890" dy="0">tokens</tspan></text><text x="890" y="245" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle"><tspan x="890" dy="0">pieces of text the LLM reads</tspan></text><text x="890" y="272" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle"><tspan x="890" dy="0">unit: tokens (~4 chars each)</tspan></text><rect x="770" y="290" width="240" height="40" rx="8" fill="#FFFFFF" stroke="#00000020"/><text x="890" y="316" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="890" dy="0">[free] [ user] [ limit]</tspan></text><text x="890" y="358" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="890" dy="0">the tokenizer decides</tspan></text><g transform="rotate(0.3 550.0 475.0)"><rect x="113" y="425" width="880" height="110" rx="6" fill="#000" opacity="0.08"/><rect x="110" y="420" width="880" height="110" rx="6" fill="#FFFFFF" stroke="#00000014"/><rect x="522.0" y="411" width="56" height="18" rx="2" fill="#E9DFC4" opacity="0.85"/></g><text x="550" y="458" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" font-weight="800" fill="#1F2937" text-anchor="middle" xml:space="preserve"><tspan x="550" dy="0">tokens sent to the LLM  ≈  k  ×  tokens per chunk</tspan></text><text x="550" y="492" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1F2937" text-anchor="middle"><tspan x="550" dy="0">example:  k = 5 chunks  ×  ~80 tokens each (256 chars of code)  =  ~400 tokens</tspan></text><text x="550" y="516" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle" font-style="italic"><tspan x="550" dy="0">Library analogy: k = how many BOOKS you take · tokens = how many WORDS are inside them</tspan></text></svg>
